<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON KAI: Тень Helix</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--cy:#19f5ff;--mg:#ff2e88;--yl:#f5e642;--tx:#d8e6ff;--mut:#7d88b0;--pn:#0c0e1a}
*{box-sizing:border-box;touch-action:manipulation}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px;color:var(--tx);font-family:'Share Tech Mono',monospace;background:radial-gradient(ellipse at 50% -10%,#2a0b3d,#07070d 65%);user-select:none}
h1,h2,.orb{font-family:Orbitron,sans-serif;margin:0}
#top{width:800px;max-width:100%;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
#title{font-size:22px;font-weight:800;color:var(--mg);text-shadow:0 0 10px var(--mg),0 0 2px #fff;letter-spacing:2px}
#mapname{color:var(--cy);font-size:13px;letter-spacing:1px}
#wrap{position:relative;margin-top:10px;width:800px;max-width:100%}
canvas{display:block;width:100%;height:auto;border:1px solid var(--cy);border-radius:4px;box-shadow:0 0 24px rgba(25,245,255,.25),inset 0 0 60px #000}
.scan{position:absolute;inset:0;pointer-events:none;border-radius:4px;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
#toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(7,7,13,.9);border:1px solid var(--yl);color:var(--yl);padding:6px 14px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#hud{width:800px;max-width:100%;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:10px}
.card{background:var(--pn);border:1px solid #242a48;padding:8px 10px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.lbl{font-size:11px;color:var(--mut);letter-spacing:1px;display:flex;justify-content:space-between}
.bar{height:7px;background:#171b30;margin-top:5px}
.bar i{display:block;height:100%;transition:width .15s}
#hpB{background:linear-gradient(90deg,#ff2e4d,#ff7a8a);box-shadow:0 0 8px #ff2e4d}
#stB{background:linear-gradient(90deg,#19f5ff,#7ef9ff);box-shadow:0 0 8px #19f5ff}
.val{font-family:Orbitron,sans-serif;font-size:15px;margin-top:4px}
#goal{width:800px;max-width:100%;margin-top:8px;padding:8px 12px;border-left:3px solid var(--mg);background:rgba(255,46,136,.07);font-size:14px}
#goal b{color:var(--mg);font-weight:normal;margin-right:6px}
#btns{width:800px;max-width:100%;display:flex;gap:8px;margin-top:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{background:transparent;color:var(--cy);border:1px solid var(--cy);padding:7px 14px;font:inherit;font-size:13px;cursor:pointer;letter-spacing:1px;transition:background .15s,color .15s}
.btn:hover:not(:disabled){background:var(--cy);color:#06060c}
.btn:disabled{opacity:.35;cursor:not-allowed;border-color:#444;color:#777}
.btn.hot{border-color:var(--mg);color:var(--mg)}
.btn.hot:hover:not(:disabled){background:var(--mg);color:#06060c}
#dlg{position:absolute;left:14px;right:14px;bottom:14px;display:none;background:linear-gradient(180deg,rgba(12,14,26,.93),rgba(6,6,12,.97));border:1px solid var(--mg);box-shadow:0 0 22px rgba(255,46,136,.35);padding:14px 18px 12px}
#dlg .spk{font-family:Orbitron,sans-serif;font-size:13px;letter-spacing:2px;margin-bottom:6px}
#dlg .txt{font-size:15px;line-height:1.5;min-height:44px}
#dlg .ch{display:flex;flex-direction:column;gap:6px;margin-top:12px}
#dlg .ch button{text-align:left;background:rgba(25,245,255,.05);border:1px solid #2a3560;color:var(--tx);padding:7px 10px;font:inherit;font-size:14px;cursor:pointer}
#dlg .ch button:hover:not(:disabled){border-color:var(--cy);background:rgba(25,245,255,.14)}
#dlg .ch button:disabled{opacity:.4;cursor:not-allowed}
.ov{position:fixed;inset:0;background:rgba(4,4,10,.86);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.ov.on{display:flex}
.panel{width:560px;max-width:100%;max-height:90vh;overflow:auto;background:var(--pn);border:1px solid var(--cy);box-shadow:0 0 30px rgba(25,245,255,.3);padding:22px 24px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
.panel h2{font-size:18px;color:var(--cy);margin-bottom:12px;letter-spacing:2px}
.panel p{line-height:1.6;font-size:15px;margin:8px 0 16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed #22294a;font-size:14px}
.row small{color:var(--mut)}
.sec{font-family:Orbitron,sans-serif;font-size:12px;color:var(--mg);margin:14px 0 4px;letter-spacing:2px}
.eq{color:var(--yl)}
#pad,#acts{display:none;position:fixed;bottom:2px;z-index:5;touch-action:none;user-select:none;-webkit-user-select:none}
#pad{left:14px}
#jsBase{width:150px;height:150px;border-radius:50%;border:2px solid rgba(25,245,255,.5);background:rgba(25,245,255,.08);position:relative}
#jsKnob{position:absolute;left:47px;top:47px;width:56px;height:56px;border-radius:50%;background:rgba(25,245,255,.35);border:2px solid var(--cy);box-shadow:0 0 14px var(--cy)}
#acts{right:14px;grid-template-columns:repeat(2,84px);gap:10px}
#acts button{width:84px;height:64px;border-radius:10px;background:rgba(255,46,136,.12);border:2px solid var(--mg);color:var(--tx);font-family:Orbitron,sans-serif;font-size:13px}
#acts button:active{background:rgba(255,46,136,.45)}
body.dlg #pad,body.dlg #acts{display:none!important}
@media (pointer:coarse){body{padding:4px 4px 16px}#wrap{margin-top:4px}#top{display:none}#ctrl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 4px 4px}#pad,#acts{position:static}#pad{display:block}#acts{display:grid}body.dlg #ctrl{display:none}#dlg .ch button{padding:12px;font-size:16px}.btn{padding:10px 16px}}
@media (max-width:820px){#hud{grid-template-columns:1fr 1fr}#title{font-size:17px}#res{font-size:12px}}
</style>
</head>
<body>
<div id="top"><div id="title">NEON KAI</div><div id="mapname"></div></div>
<div id="wrap">
  <canvas id="cv" width="800" height="480"></canvas>
  <div class="scan"></div>
  <div id="toast"></div>
  <div id="dlg"></div>
</div>
<div id="hud">
  <div class="card"><div class="lbl"><span>ЗДОРОВЬЕ</span><span id="hpT"></span></div><div class="bar"><i id="hpB"></i></div></div>
  <div class="card"><div class="lbl"><span>СПРИНТ</span><span id="stT"></span></div><div class="bar"><i id="stB"></i></div></div>
  <div class="card"><div class="lbl"><span>ИНТЕЛЕКТ</span></div><div class="val" id="inT"></div></div>
  <div class="card"><div class="lbl"><span>ОРУЖИЕ</span></div><div class="val" id="wpT" style="font-size:12px"></div></div>
</div>
<div id="goal"></div>
<div id="btns">
  <button class="btn" onclick="openInv()">ИНВЕНТАРЬ [I]</button>
  <button class="btn" onclick="help()">УПРАВЛЕНИЕ [H]</button>
</div>
<div id="res" class="card" style="width:800px;max-width:100%;margin-top:8px;font-size:14px;display:flex;gap:18px;flex-wrap:wrap"></div>

<div class="ov" id="over"><div class="panel"><h2 id="oT"></h2><p id="oP"></p><div style="text-align:right"><button class="btn hot" id="oB"></button></div></div></div>
<div class="ov" id="modal"><div class="panel" id="mP"></div></div>
<div id="ctrl"><div id="pad"><div id="jsBase"><div id="jsKnob"></div></div></div>
<div id="acts"><button id="bRun">БЕГ</button><button id="bFire">ОГОНЬ</button><button id="bAct">E</button><button id="bInv">I</button></div></div>

const NPCS={
 lu:{n:'Бабушка Лу',c:'#ffb347',start:()=>S.F.lu_clue?'after':'intro',d:{
  intro:{t:'Ещё одна девочка с проводами в волосах... Ты Кай? Мира о тебе говорила. Садись, пока дроны не заметили.',c:[{t:'Где Мира?',n:'where'},{t:'Мне нужны ответы, а не чай.',n:'rude'},{t:'Что ты продаёшь?',n:'pay'}]},

  where:{t:'Устроилась в Helix, ночной инженер нейросетей. Потом перестала выходить на связь. Последний сигнал пришёл из башни.',c:[{t:'Что такое Helix?',n:'helix'},{t:'Понял. Спасибо.'}]},
  helix:{t:'Корпорация, которая строит половину неба над нами, и ставит нейроимпланты тем, кто не спрашивает. Мира нашла, что они делают с людьми.',c:[{t:'Я найду её.'}]},

const k={};let S,P,cur,mode,D=null,combat=null,toastT=0;
function fresh(){return{hp:100,mhp:100,stam:100,int:4,cr:50,scrap:0,chips:0,cells:0,titan:0,data:0,armor:false,wpn:'knife',inv:{medkit:1,pistol:1,knife:1},F:{},taken:{}}}
function newGame(){S=fresh();cur='slums';P={x:2*T+20,y:6*T+20,fx:0,fy:1};mode='play';D=null;combat=null;closeAll();msg(MAPS.slums.name)}
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const $=id=>document.getElementById(id);

function msg(t){const e=$('toast');e.textContent=t;e.classList.add('on');toastT=2.6}
function closeAll(){$('over').classList.remove('on');$('modal').classList.remove('on');$('dlg').style.display='none';if(mode!=='play'&&mode!=='intro')mode='play'}
function overlay(t,p,b,cb){$('oT').textContent=t;$('oP').textContent=p;$('oB').textContent=b;$('oB').onclick=cb;$('over').classList.add('on');mode='over'}
function help(){overlay('Управление','WASD / стрелки: движение. Shift: спринт (тратит спринт-шкалу). E: говорить, собирать ресурсы, пользоваться терминалом. I: инвентарь. 1–4: выбрать ответ в диалоге. Esc: закрыть окно. Касание дрона запускает бой.','Понятно',()=>{$('over').classList.remove('on');mode='play'})}

function wallAt(x,y){const m=MAPS[cur];for(const[ox,oy]of[[-11,-11],[11,-11],[-11,11],[11,11]]){const tx=Math.floor((x+ox)/T),ty=Math.floor((y+oy)/T);const c=m.rows[ty]&&m.rows[ty][tx];if(c===undefined||c==='#')return true}return false}

function goal(){
 if(!S.F.lu_clue)return'Поговорить с Бабушкой Лу в Трущобах';
 if(!S.F.keycard)return'Достать ключ-карту у Пикселя на Чёрном рынке';
 if(!S.F.voss_ok)return'Пройти офицера Восс в башне Helix';
 if(!S.F.mira_loc)return'Найти терминал с логами Миры в башне';
 return'Спуститься к доктору Рену в нижний уровень';
}

function showNode(npc,key){
 const node=npc.d[key];if(!node)return closeDlg();
 if(node.f)S.F[node.f]=true;
 D={npc,node};mode='dialog';renderDlg();
}
function renderDlg(){
 const b=$('dlg');b.style.display='block';document.body.classList.add('dlg');
 b.innerHTML=`<div class="spk" style="color:${D.npc.c}">${D.npc.n}</div><div class="txt">${D.node.t}</div><div class="ch">${D.node.c.map((c,i)=>{
  const lock=(c.req&&S.int<c.req.int)||(c.cost&&S.cr<c.cost);
  return `<button ${lock?'disabled':''} onclick="pick(${i})">${i+1}. ${c.t}${c.req?` [ИНТ ${c.req.int}]`:''}${c.cost?` [${c.cost} кр.]`:''}</button>`}).join('')}</div>`;
}
function closeDlg(){document.body.classList.remove('dlg');$('dlg').style.display='none';D=null;if(mode==='dialog')mode='play'}
function talk(id){const n=NPCS[id];mode='dialog';showNode(n,n.start())}

function pick(i){
 const c=D.node.c[i];if(!c)return;
 if(c.req&&S.int<c.req.int)return;
 if(c.cost){if(S.cr<c.cost)return msg('Не хватает кредитов');S.cr-=c.cost}
 if(c.act==='shop')return(closeDlg(),openShop());
 if(c.act==='sellm')return(closeDlg(),openSell());
 if(c.act==='hit')return fight();
 if(c.act==='flee')return flee();
 if(c.f)S.F[c.f]=true;
 if(c.give){for(const q in c.give)if(S[q]+c.give[q]<0)return msg('Не хватает: '+(RN[q]||q));for(const q in c.give)S[q]+=c.give[q]}
 if(c.end)return finale(c.end);
 if(c.n)return showNode(D.npc,c.n);
 closeDlg();
}

function startFight(e,key){
 combat={e,key};
 D={npc:{n:'Дрон-охранник',c:'#ff2e4d'},node:{t:fightText(e),c:[{t:`Атаковать (${WEP[S.wpn].n})`,act:'hit'},{t:'Отступить',act:'flee'}]}};
 mode='dialog';renderDlg();
}
const fightText=e=>`Дрон блокирует путь. Прочность: ${Math.max(0,Math.ceil(e.hp))}. Твоё здоровье: ${Math.max(0,Math.ceil(S.hp))}.`;
function fight(){
 const e=combat.e;e.hp-=WEP[S.wpn].dmg*(0.8+Math.random()*0.4);
 if(e.hp<=0){S.taken[combat.key]=1;const L=2+(Math.random()*3|0);S.scrap+=L;msg(`Дрон уничтожен +${L} лома`);combat=null;return closeDlg()}
 S.hp-=S.armor?4:8;
 if(S.hp<=0)return die();
 D.node.t=fightText(e);renderDlg();
}
function flee(){
 const e=combat.e,ex=e.x*T+20;
 if(Math.random()<.5){const s=P.x<ex?-1:1;if(!wallAt(P.x+s*50,P.y))P.x+=s*50;combat=null;msg('Ты ушёл от дрона');closeDlg()}
 else{S.hp-=6;if(S.hp<=0)return die();D.node.t='Не вышло! Дрон задел тебя.\n'+fightText(combat.e);renderDlg()}
}
function die(){combat=null;closeDlg();overlay('Ты погиб','Сектор 7 забрал ещё одного. Твоя сестра так и не узнала, что ты пытался.','Начать заново',()=>newGame())}
function finale(key){
 if(key==='B')S.cr+=400;
 closeDlg();mode='over';
 overlay(FIN[key][0],FIN[key][1],'Новая игра',()=>newGame());
}

function openShop(){mode='modal';$('modal').classList.add('on');renderShop()}
function renderShop(){
 $('mP').innerHTML=`<h2>ЧЁРНЫЙ РЫНОК</h2><p style="font-size:13px;color:#7d88b0">Кредиты: <span class="eq">${S.cr}</span></p>`+
 Object.entries(SHOP).map(([id,s])=>`<div class="row"><div>${s.n}<br><small>${s.p} кр.</small></div><button class="btn" ${S.cr<s.p||(s.w&&S.inv[id])?'disabled':''} onclick="buy('${id}')">${s.w&&S.inv[id]?'КУПЛЕНО':'КУПИТЬ'}</button></div>`).join('')+
 `<div style="text-align:right;margin-top:14px"><button class="btn hot" onclick="closeModal()">ЗАКРЫТЬ</button></div>`;
}
function buy(id){const s=SHOP[id];if(S.cr<s.p)return;S.cr-=s.p;S.inv[id]=(S.inv[id]||0)+1;msg('Куплено: '+s.n.split(' (')[0]);renderShop()}
function closeModal(){$('modal').classList.remove('on');mode='play'}
const SELL={scrap:2,chips:15,cells:10,titan:12,data:25};
function openSell(){mode='modal';$('modal').classList.add('on');renderSell()}
function renderSell(){
 $('mP').innerHTML=`<h2>ПРОДАЖА ЗОРГУ</h2><p style="font-size:13px;color:#7d88b0">Зорг платит: лом 2 кр., чипы 15 кр., энергоячейки 10 кр.</p>`+
 Object.keys(SELL).map(r=>`<div class="row"><div>${RN[r]} <small>у тебя: ${S[r]}</small></div><div><button class="btn" ${S[r]<1?'disabled':''} onclick="sell('${r}',1)">×1</button> <button class="btn" ${S[r]<1?'disabled':''} onclick="sell('${r}',S['${r}'])">ВСЁ</button></div></div>`).join('')+
 `<div style="text-align:right;margin-top:14px"><button class="btn hot" onclick="closeModal()">ЗАКРЫТЬ</button></div>`;
}
function sell(r,n){n=Math.min(n,S[r]);if(n<1)return;S[r]-=n;S.cr+=n*SELL[r];msg(`Продано: ${n} ${RN[r]} (+${n*SELL[r]} кр.)`);renderSell()}

function openInv(){if(mode==='over')return;mode='modal';$('modal').classList.add('on');renderInv()}
function renderInv(){
 const items=[['medkit','Аптечка','use'],['stim','Стимулятор','use']];
 const crafts=[
  ['Аптечка','10 лома + 2 энергоячейки',S.scrap>=10&&S.cells>=2,()=>{S.scrap-=10;S.cells-=2;S.inv.medkit=(S.inv.medkit||0)+1}],
  ['Нейроимплант (+1 ИНТ)','4 чипа + 2 энергоячейки + 1 титан',S.chips>=4&&S.cells>=2&&S.titan>=1&&S.int<10,()=>{S.chips-=4;S.cells-=2;S.titan-=1;S.int++}],
  ['Бронежилет (-50% урона)','8 титана + 15 лома + 1 кристалл данных',S.titan>=8&&S.scrap>=15&&S.data>=1&&!S.armor,()=>{S.titan-=8;S.scrap-=15;S.data-=1;S.armor=true}]
 ];
 $('mP').innerHTML=`<h2>ИНВЕНТАРЬ</h2>
 <div class="sec">РЕСУРСЫ</div>
 <div class="row"><span>Кредиты</span><span class="eq">${S.cr}</span></div>
 <div class="row"><span>Лом</span><span>${S.scrap}</span></div>
 <div class="row"><span>Чипы</span><span>${S.chips}</span></div>
 <div class="row"><span>Энергоячейки</span><span>${S.cells}</span></div>
 <div class="row"><span>Титан</span><span>${S.titan}</span></div>
 <div class="row"><span>Кристаллы данных</span><span>${S.data}</span></div>
 <div class="sec">ОРУЖИЕ</div>
 ${Object.entries(WEP).filter(([id])=>S.inv[id]).map(([id,w])=>`<div class="row"><span>${w.n} <small>урон ${w.dmg}</small></span><button class="btn" ${S.wpn===id?'disabled':''} onclick="equip('${id}')">${S.wpn===id?'В РУКАХ':'ВЗЯТЬ'}</button></div>`).join('')}
 <div class="sec">ПРЕДМЕТЫ</div>
 ${items.filter(([id])=>S.inv[id]).map(([id,n])=>`<div class="row"><span>${n} ×${S.inv[id]}</span><button class="btn" onclick="useItem('${id}')">ИСПОЛЬЗОВАТЬ</button></div>`).join('')||'<div class="row"><small>Пусто</small></div>'}
 <div class="sec">СОЗДАНИЕ</div>
 ${crafts.map((c,i)=>`<div class="row"><div>${c[0]}<br><small>${c[1]}</small></div><button class="btn" ${c[2]?'':'disabled'} onclick="craft(${i})">СОЗДАТЬ</button></div>`).join('')}
 <div style="text-align:right;margin-top:14px"><button class="btn hot" onclick="closeModal()">ЗАКРЫТЬ</button></div>`;
 window._crafts=crafts;
}
function equip(id){S.wpn=id;msg('В руках: '+WEP[id].n);renderInv()}
function useItem(id){
 if(!S.inv[id])return;S.inv[id]--;if(!S.inv[id])delete S.inv[id];
 if(id==='medkit')S.hp=Math.min(S.mhp,S.hp+35);
 if(id==='stim')S.stam=100;
 renderInv();
}
function craft(i){const c=window._crafts[i];if(!c[2])return;c[3]();msg('Создано: '+c[0].split(' (')[0]);renderInv()}

function interact(){
 if(mode!=='play')return;
 const m=MAPS[cur];
 for(const n of m.npcs){if(dist(P.x,P.y,n.x*T+20,n.y*T+20)<56)return talk(n.id)}
 let got=false;
 m.res.forEach((r,i)=>{const key=cur+':r'+i;if(!S.taken[key]&&dist(P.x,P.y,r.x*T+20,r.y*T+20)<42){S.taken[key]=1;S[r.t]+=r.n;msg(`+${r.n} ${RN[r.t]}`);got=true}});
 if(got)return;
 if(m.term&&dist(P.x,P.y,m.term.x*T+20,m.term.y*T+20)<46){
  if(!S.F.mira_loc){S.F.mira_loc=true;S.chips+=2;msg('Логи: Мира в лаборатории Рена, нижний уровень. +2 чипа')}
  else msg('Логи уже скачаны');
 }
}

function go(ex){
 if(ex.need&&!S.F[ex.need]){
  msg(ex.msg||'Доступ закрыт');
  const s=ex.x===0?1:(ex.x===W-1?-1:0);const sy=ex.y===0?1:(ex.y===H-1?-1:0);
  P.x+=s*T*.6;P.y+=sy*T*.6;return;
 }
 cur=ex.to;P.x=ex.tx*T+20;P.y=ex.ty*T+20;msg(MAPS[cur].name);
}

const K={};
addEventListener('keydown',e=>{
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
 K[e.code]=true;
 if(e.code==='Escape'){if(mode==='modal')closeModal();else if(mode==='dialog')closeDlg()}
 if(e.code==='KeyI'&&mode!=='dialog'&&mode!=='over'){mode==='modal'?closeModal():openInv()}
 if(e.code==='KeyH'&&mode==='play')help();
 if(e.code==='KeyE'){if(mode==='play')interact();}
 if(mode==='dialog'&&/^Digit[1-4]$/.test(e.code))pick(+e.code.slice(-1)-1);
});
addEventListener('keyup',e=>K[e.code]=false);

function update(dt){
 if(mode!=='play')return;
 let dx=0,dy=0;
 if(K.KeyW||K.ArrowUp)dy--;if(K.KeyS||K.ArrowDown)dy++;if(K.KeyA||K.ArrowLeft)dx--;if(K.KeyD||K.ArrowRight)dx++;
 const moving=dx||dy;
 const sprint=moving&&(K.ShiftLeft||K.ShiftRight)&&S.stam>0;
 S.stam=sprint?Math.max(0,S.stam-30*dt):Math.min(100,S.stam+14*dt);
 if(moving){
  const l=Math.hypot(dx,dy),v=(sprint?230:130)*dt;
  const mx=dx/l*v,my=dy/l*v;P.fx=dx/l;P.fy=dy/l;
  if(!wallAt(P.x+mx,P.y))P.x+=mx;
  if(!wallAt(P.x,P.y+my))P.y+=my;
 }
 const m=MAPS[cur];
 const tx=Math.floor(P.x/T),ty=Math.floor(P.y/T);
 const ex=m.exits.find(e=>e.x===tx&&e.y===ty);
 if(ex)go(ex);
 m.en.forEach((e,i)=>{
  const key=cur+':e'+i;if(S.taken[key])return;
  if(combat&&combat.e===e)return;
  const qx=e.x*T+20,qy=e.y*T+20,dd=Math.max(1,dist(P.x,P.y,qx,qy));if(!e.chase&&dd<80)e.chase=true;if(e.chase&&dd>180)e.chase=false;if(e.chase){const sp=150*dt/dd;e.x+=(P.x-qx)*sp/T;e.y+=(P.y-qy)*sp/T}else{e.x+=e.d*1.1*dt;if(e.x>=e.b){e.x=e.b;e.d=-1}if(e.x<=e.a){e.x=e.a;e.d=1}}
  if(mode==='play'&&dist(P.x,P.y,e.x*T+20,e.y*T+20)<30)startFight(e,key);
 });
}

function drawPlayer(t){
 const x=P.x,y=P.y,moving=K.KeyW||K.KeyS||K.KeyA||K.KeyD||K.ArrowUp||K.ArrowDown||K.ArrowLeft||K.ArrowRight;
 const bob=moving?Math.sin(t/90)*1.5:0;
 ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.ellipse(x,y+12,10,4,0,0,7);ctx.fill();
 ctx.save();ctx.translate(x,y+bob);
 ctx.fillStyle='#1b1f3b';ctx.fillRect(-7,-2,14,14);
 ctx.fillStyle='#19f5ff';ctx.fillRect(-7,-2,14,2);
 ctx.fillStyle='#f2c9a0';ctx.beginPath();ctx.arc(0,-8,6,0,7);ctx.fill();
 ctx.fillStyle='#19f5ff';ctx.beginPath();ctx.arc(0,-9,6.5,Math.PI,2*Math.PI);ctx.fill();
 ctx.fillStyle='#000';ctx.fillRect(-3+P.fx*1.5,-9+P.fy*1.5,1.5,1.5);ctx.fillRect(1+P.fx*1.5,-9+P.fy*1.5,1.5,1.5);
 ctx.restore();
 if(S.wpn!=='knife'){ctx.strokeStyle='#f5e642';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+P.fx*8,y+P.fy*8);ctx.lineTo(x+P.fx*18,y+P.fy*18);ctx.stroke()}
}

const cv=$('cv'),ctx=cv.getContext('2d');
function draw(t){
 const m=MAPS[cur];
 ctx.fillStyle='#07070d';ctx.fillRect(0,0,800,480);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const c=m.rows[y][x],px=x*T,py=y*T;
  if(c==='#'){
   ctx.fillStyle='#15132b';ctx.fillRect(px,py,T,T);
   ctx.strokeStyle='#2e2a66';ctx.strokeRect(px+.5,py+.5,T-1,T-1);
   if((x*7+y*3)%5===0){ctx.fillStyle=m.col+'66';ctx.fillRect(px+5,py+T-7,T-10,2)}
  }else{
   ctx.fillStyle='#0b0b16';ctx.fillRect(px,py,T,T);
   ctx.fillStyle='#22243f';ctx.fillRect(px+T/2-1,py+T/2-1,2,2);
  }
 }
 m.exits.forEach(e=>{
  const locked=e.need&&!S.F[e.need];const a=.5+.3*Math.sin(t/300);
  ctx.fillStyle=locked?'rgba(255,46,77,.18)':`rgba(25,245,255,${a*.22})`;ctx.fillRect(e.x*T,e.y*T,T,T);
  ctx.strokeStyle=locked?'#ff2e4d':`rgba(25,245,255,${a+.2})`;ctx.strokeRect(e.x*T+3,e.y*T+3,T-6,T-6);
  ctx.fillStyle=ctx.strokeStyle;ctx.font='16px Orbitron';ctx.textAlign='center';ctx.fillText(locked?'×':'→',e.x*T+T/2,e.y*T+T/2+6);
 });
 m.res.forEach((r,i)=>{
  if(S.taken[cur+':r'+i])return;
  const[ch,col]=RI[r.t];const px=r.x*T+20,py=r.y*T+20+Math.sin(t/400+i)*2;
  ctx.strokeStyle=col;ctx.shadowColor=col;ctx.shadowBlur=10;ctx.strokeRect(px-9,py-9,18,18);ctx.shadowBlur=0;
  ctx.fillStyle=col;ctx.font='12px Orbitron';ctx.textAlign='center';ctx.fillText(ch,px,py+4);
 });
 if(m.term){
  const px=m.term.x*T+6,py=m.term.y*T+8;
  ctx.fillStyle='#0a2a1a';ctx.fillRect(px,py,28,22);ctx.strokeStyle='#4dff9a';ctx.strokeRect(px,py,28,22);
  ctx.fillStyle='#4dff9a';ctx.font='9px monospace';ctx.textAlign='left';
  for(let i=0;i<3;i++)ctx.fillText(i===2&&Math.floor(t/400)%2?'> _':'> '+'#'.repeat(3-i),px+3,py+8+i*5);
 }
 m.en.forEach((e,i)=>{
  if(S.taken[cur+':e'+i])return;
  const px=e.x*T+20,py=e.y*T+20;
  ctx.strokeStyle=`rgba(255,46,77,${.4+.4*Math.sin(t/200)})`;ctx.beginPath();ctx.arc(px,py,16+Math.sin(t/200)*2,0,7);ctx.stroke();
  ctx.fillStyle='#ff2e4d';ctx.shadowColor='#ff2e4d';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(px,py,9,0,7);ctx.fill();ctx.shadowBlur=0;

  ctx.fillStyle='#071a10';ctx.fillRect(px-13,py-12,26,22);
  ctx.fillStyle='#1d5a36';ctx.fillRect(px-13,py-12,26,3);
  const sc=ctx.createLinearGradient(0,py-9,0,py+9);sc.addColorStop(0,'#0f4a2a');sc.addColorStop(1,'#0a2a18');ctx.fillStyle=sc;ctx.fillRect(px-10,py-8,20,16);
  ctx.fillStyle='#4dff9a';ctx.font='7px monospace';ctx.textAlign='left';ctx.fillText('> '+(Math.floor(t/400)%2?'_':' '),px-8,py-2);ctx.fillText('LOGS',px-8,py+5);
 }
 m.en.forEach((e,i)=>{if(S.taken[cur+':e'+i])return;const px=e.x*T+20,py=e.y*T+20;
  glow(px,py,50,'255,46,77',.4);
  const bob=Math.sin(t/200)*2;
  ctx.fillStyle='#3a3f52';ctx.beginPath();ctx.ellipse(px,py+bob,11,8,0,0,7);ctx.fill();
  ctx.fillStyle='#1a1d2a';ctx.beginPath();ctx.ellipse(px,py+bob-1,9,6,0,0,7);ctx.fill();
  ctx.save();ctx.shadowColor='#ff2e4d';ctx.shadowBlur=10;ctx.fillStyle='#ff2e4d';ctx.beginPath();ctx.arc(px,py+bob,3,0,7);ctx.fill();ctx.restore();
 });
 if(m.boss&&!S.taken[cur+':boss']){
  drawBoss(m.boss,t);
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(240,34,320,10);
  ctx.fillStyle='#ff2e4d';ctx.fillRect(240,34,320*Math.max(0,m.boss.hp)/m.boss.max,10);
  ctx.strokeStyle='#ff2e4d';ctx.strokeRect(240.5,34.5,319,9);
 }
 m.npcs.forEach(n=>{const npc=NPCS[n.id],px=n.x*T+20,py=n.y*T+20,rgb=hr(npc.c);
  glow(px,py,46,rgb,.22);
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(px,py+14,10,3.5,0,0,7);ctx.fill();
  const bg2=ctx.createLinearGradient(px-8,0,px+8,0);bg2.addColorStop(0,'#15172a');bg2.addColorStop(1,'#080914');
  ctx.fillStyle=bg2;ctx.fillRect(px-8,py-2,16,15);
  ctx.fillStyle=npc.c;ctx.fillRect(px-8,py-2,16,2);ctx.fillRect(px-1,py,2,13);
  const hg=ctx.createRadialGradient(px-2,py-12,1,px,py-10,7);hg.addColorStop(0,'#f3d6b4');hg.addColorStop(1,'#b98a66');
  ctx.fillStyle=hg;ctx.beginPath();ctx.ellipse(px,py-10,6,7,0,0,7);ctx.fill();
  ctx.fillStyle=npc.c;ctx.beginPath();ctx.ellipse(px,py-14,6.5,4,0,Math.PI,2*Math.PI);ctx.fill();
  ctx.fillStyle='#000';ctx.fillRect(px-3,py-11,1.5,1.5);ctx.fillRect(px+1.5,py-11,1.5,1.5);
  ctx.save();ctx.shadowColor=npc.c;ctx.shadowBlur=6;ctx.fillStyle=npc.c;ctx.font='11px monospace';ctx.textAlign='center';ctx.fillText(npc.n,px,py-24);ctx.restore();
  if(dist(P.x,P.y,px,py)<56){ctx.fillStyle='#f5e642';ctx.font='11px monospace';ctx.textAlign='center';ctx.fillText('[E]',px,py+28)}
 });
 drawPlayer(t);
 ctx.strokeStyle='rgba(170,200,255,.22)';ctx.lineWidth=1;ctx.beginPath();
 RAIN.forEach(d=>{d.y+=d.s*2.2;d.x-=d.s*.4;if(d.y>480){d.y=-10;d.x=Math.random()*820}if(d.x<0)d.x+=800;ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-d.s*.4,d.y-d.s*2)});
 ctx.stroke();
 ctx.fillStyle='rgba(120,40,200,.07)';ctx.fillRect(0,0,800,480);
 const v=ctx.createRadialGradient(400,240,160,400,240,480);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.78)');ctx.fillStyle=v;ctx.fillRect(0,0,800,480);
}
const JB=$('jsBase'),JKn=$('jsKnob');let jsId=null,jcx=0,jcy=0;
function jsSet(dx,dy){K.KeyA=dx<-.35;K.KeyD=dx>.35;K.KeyW=dy<-.35;K.KeyS=dy>.35}
function jsMove(e){if(e.pointerId!==jsId)return;let dx=e.clientX-jcx,dy=e.clientY-jcy;const R=50,l=Math.hypot(dx,dy);if(l>R){dx=dx/l*R;dy=dy/l*R}JKn.style.transform=`translate(${dx}px,${dy}px)`;jsSet(dx/R,dy/R)}
JB.addEventListener('pointerdown',e=>{e.preventDefault();jsId=e.pointerId;JB.setPointerCapture(jsId);const r=JB.getBoundingClientRect();jcx=r.left+r.width/2;jcy=r.top+r.height/2;jsMove(e)});
JB.addEventListener('pointermove',jsMove);
const jsEnd=e=>{if(e.pointerId!==jsId)return;jsId=null;JKn.style.transform='';jsSet(0,0)};
JB.addEventListener('pointerup',jsEnd);JB.addEventListener('pointercancel',jsEnd);
function hold(id,code){const b=$(id);const off=()=>{K[code]=false};b.addEventListener('pointerdown',e=>{e.preventDefault();K[code]=true});b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off)}
hold('bFire','Space');hold('bRun','ShiftLeft');
$('bAct').addEventListener('pointerdown',e=>{e.preventDefault();dispatchEvent(new KeyboardEvent('keydown',{code:'KeyE'}))});
$('bInv').addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='modal')closeModal();else if(mode==='play')openInv()});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault());
const _drawWorld=draw;
draw=function(t){
 const Z=1.5,camX=Math.max(0,Math.min(800-800/Z,P.x-400/Z)),camY=Math.max(0,Math.min(480-480/Z,P.y-240/Z));
 ctx.setTransform(Z,0,0,Z,-camX*Z,-camY*Z);
 _drawWorld(t);
 ctx.setTransform(1,0,0,1,0,0);
};
let last=performance.now();
function loop(t){
 const dt=Math.min(.05,(t-last)/1000);last=t;
 update(dt);tick(dt);draw(t);hud();
 if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').classList.remove('on')}
 requestAnimationFrame(loop);
}
S=fresh();cur='slums';P={x:2*T+20,y:6*T+20,fx:0,fy:1};mode='over';
overlay('NEON KAI: Тень Helix','Ночь. Сектор 7. Твоя сестра Мира пропала три дня назад. Её последний сигнал пришёл из башни Helix. Найди её, пока корпорация не стёрла её разум. WASD — движение, E — говорить и собирать, I — инвентарь, H — управление.','Начать',()=>{newGame()});
requestAnimationFrame(loop);
</script>
