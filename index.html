<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Кликер Вселенная</title>
<style>
:root{
  --bg:#07070d;
  --glass:rgba(255,255,255,.045);
  --glass-2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.09);
  --txt:#f4f4fb;
  --mut:#8b8ba3;
  --gold1:#ffe27a;--gold2:#ffaa2b;--gold3:#ff6b1a;
  --pink:#ff5fd2;--violet:#7c5cff;--cyan:#38e1ff;
  --win:#3ddc84;--lose:#ff4d6d;
  --r-xl:28px;--r-lg:20px;--r-md:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:"Inter","SF Pro Display",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--txt);background:var(--bg);padding:28px 16px 40px;overflow-x:hidden;
  color-scheme:dark;-webkit-font-smoothing:antialiased;
}
/* Aurora-фон */
body::before,body::after{
  content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.35;z-index:-1;pointer-events:none;
  animation:drift 18s ease-in-out infinite alternate;
}
body::before{background:radial-gradient(circle,var(--violet),transparent 65%);top:-20vmax;left:-15vmax}
body::after{background:radial-gradient(circle,var(--pink),transparent 65%);bottom:-25vmax;right:-15vmax;animation-duration:22s;animation-delay:-6s}
@keyframes drift{to{transform:translate(8vw,6vh) scale(1.15)}}

.view{display:none}
.view.on{display:block;animation:fadeUp .5s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

h1{font-size:clamp(1.5rem,4vw,2rem);font-weight:900;letter-spacing:-.03em;background:linear-gradient(100deg,#fff 0%,var(--gold1) 35%,var(--pink) 75%,var(--violet) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--mut);margin-bottom:14px;display:flex;align-items:center;gap:8px}

.glass{background:linear-gradient(180deg,var(--glass-2),var(--glass));border:1px solid var(--line);border-radius:var(--r-xl);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 30px 60px -20px rgba(0,0,0,.6)}

.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--glass-2);border:1px solid var(--line);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;backdrop-filter:blur(10px)}
.pill b{background:linear-gradient(90deg,var(--gold1),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}

.pbtn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--glass-2);color:var(--txt);font:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s;backdrop-filter:blur(10px)}
.pbtn:hover:not(:disabled){transform:translateY(-2px);background:rgba(255,255,255,.12);box-shadow:0 10px 30px -10px rgba(124,92,255,.6)}
.pbtn:active:not(:disabled){transform:scale(.97)}
.pbtn:disabled{opacity:.35;cursor:not-allowed}
.pbtn.gold{background:linear-gradient(135deg,var(--gold1),var(--gold2) 50%,var(--gold3));color:#1a0d00;border:none;box-shadow:0 10px 30px -8px rgba(255,170,43,.7)}
.pbtn.gold:hover:not(:disabled){box-shadow:0 14px 40px -8px rgba(255,170,43,.9)}

/* ---------- Кликер ---------- */
.wrap{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1.05fr 1fr;gap:28px;align-items:start}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
.stage{display:flex;flex-direction:column;align-items:center;gap:18px;padding:28px 20px}
.top{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.score{font-size:clamp(2.8rem,8vw,4.2rem);font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff,#cfcfe6);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 28px rgba(255,210,90,.25))}
.rate{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--mut);font-weight:600}
.rate::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--win);box-shadow:0 0 12px var(--win);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
#goal{font-size:13px;color:var(--mut);text-align:center;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line)}

/* Монета */
.coinWrap{position:relative;width:250px;height:250px;display:grid;place-items:center;margin:6px 0}
.coinWrap::before{content:"";position:absolute;inset:-18px;border-radius:50%;background:conic-gradient(from 0deg,var(--gold1),var(--pink),var(--violet),var(--cyan),var(--gold1));filter:blur(28px);opacity:.45;animation:spin 8s linear infinite}
.coinWrap::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px dashed rgba(255,255,255,.14);animation:spin 26s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
#coin{
  position:relative;width:230px;height:230px;border-radius:50%;border:none;cursor:pointer;font-size:6rem;
  background:radial-gradient(circle at 32% 26%,#fff9c9 0%,var(--gold1) 22%,var(--gold2) 58%,var(--gold3) 100%);
  box-shadow:inset 0 -14px 30px rgba(120,40,0,.35),inset 0 10px 22px rgba(255,255,255,.45),0 24px 60px -10px rgba(255,140,30,.6);
  transition:transform .12s cubic-bezier(.2,.8,.2,1),filter .3s;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  animation:float 4s ease-in-out infinite;overflow:hidden;
}
#coin::after{content:"";position:absolute;top:-60%;left:-80%;width:45%;height:220%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:rotate(25deg);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,60%{left:-80%}100%{left:130%}}
@keyframes float{50%{transform:translateY(-10px)}}
#coin:active,#coin.hit{transform:scale(.92)}
#coin.locked{filter:grayscale(1) brightness(.55);cursor:not-allowed;animation:none}
#warn{min-height:24px;color:#ff8a9c;font-weight:700;text-align:center;font-size:14px}

/* Панели */
.cpanel{padding:22px;display:flex;flex-direction:column;gap:12px}
.list{display:grid;gap:10px}
.up{display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--r-md);background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--txt);cursor:pointer;text-align:left;transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,background .25s;width:100%;font:inherit;position:relative;overflow:hidden}
.up::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent,rgba(255,255,255,.06),transparent);transform:translateX(-100%);transition:transform .6s}
.up:hover:not(:disabled){transform:translateY(-2px);border-color:rgba(255,200,90,.35);background:rgba(255,255,255,.06)}
.up:hover:not(:disabled)::before{transform:translateX(100%)}
.up:disabled{opacity:.42;cursor:not-allowed}
.up.star:hover:not(:disabled){border-color:rgba(124,92,255,.5)}
.ico{font-size:1.9rem;width:46px;text-align:center;flex-shrink:0;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.info{flex:1;min-width:0}
.info b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.info small{color:var(--mut);font-size:12.5px}
.right{text-align:right}
.cost{font-weight:800;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums;background:linear-gradient(90deg,var(--gold1),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lvl{font-size:11px;color:var(--mut);margin-top:3px;text-transform:uppercase;letter-spacing:.06em;min-height:13px}

/* Эффекты */
.fx{position:fixed;pointer-events:none;font-weight:900;font-size:1.6rem;color:var(--gold1);text-shadow:0 0 18px rgba(255,200,60,.7),0 2px 8px #000;animation:up .95s cubic-bezier(.2,.8,.2,1) forwards;z-index:10;font-variant-numeric:tabular-nums}
@keyframes up{to{transform:translateY(-100px) scale(1.15);opacity:0}}
.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%);background:linear-gradient(100deg,var(--gold1),var(--pink),var(--violet));background-size:200% 100%;color:#120a1f;font-weight:800;padding:13px 24px;border-radius:999px;box-shadow:0 18px 50px -12px rgba(255,95,210,.6);z-index:20;pointer-events:none;animation:pop 2.6s cubic-bezier(.2,.8,.2,1) forwards;white-space:nowrap;font-size:14px}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-24px) scale(.9)}10%,80%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0}}

/* ---------- Апгрейдер ---------- */
.app{max-width:460px;margin:0 auto;display:grid;gap:16px}
.uhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel{padding:22px}
.gauge{position:relative;width:min(270px,82vw);aspect-ratio:1;margin:4px auto 0}
.gauge svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 0 30px rgba(255,140,30,.25))}
.pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.pct b{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.03em;background:linear-gradient(180deg,#fff,var(--gold1));-webkit-background-clip:text;background-clip:text;color:transparent}
.pct span{margin-top:2px;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.16em}
.cards{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:16px}
.mini{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 10px;text-align:center;display:grid;gap:5px;min-height:136px;align-content:center}
.mini .ico{font-size:38px;width:auto}
.mini small{color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.12em}
.mini b{font-size:14px;font-weight:700}
.mini .v{font-weight:800;color:var(--gold1);font-variant-numeric:tabular-nums;font-size:15px}
.mini.tgt{border-color:rgba(61,220,132,.25);background:linear-gradient(180deg,rgba(61,220,132,.08),rgba(255,255,255,.02))}
.mini.tgt .v{color:var(--win)}
.arrow{color:var(--mut);font-size:22px}
.umult{text-align:center;color:var(--mut);font-size:13px;margin:14px 0 10px;line-height:1.5}
.umult b{color:var(--txt)}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:5px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.chip{background:transparent;border:none;color:var(--mut);border-radius:999px;padding:10px 0;font:inherit;font-weight:800;font-size:13px;cursor:pointer;transition:.25s;font-variant-numeric:tabular-nums}
.chip:hover:not(:disabled){color:var(--txt)}
.chip.on{background:linear-gradient(135deg,var(--gold1),var(--gold2) 60%,var(--gold3));color:#1a0d00;box-shadow:0 8px 22px -6px rgba(255,170,43,.8)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.go{width:100%;margin-top:16px;border:0;border-radius:18px;padding:18px;font-family:inherit;font-weight:900;font-size:16px;letter-spacing:.12em;color:#fff;cursor:pointer;background:linear-gradient(100deg,var(--violet),var(--pink) 60%,var(--gold2));background-size:200% 100%;box-shadow:0 16px 40px -12px rgba(255,95,210,.6);transition:transform .2s,background-position .6s,box-shadow .3s}
.go:hover:not(:disabled){background-position:100% 0;transform:translateY(-2px);box-shadow:0 20px 50px -12px rgba(255,95,210,.8)}
.go:active:not(:disabled){transform:scale(.98)}
.go:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.sell{width:100%;margin-top:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--mut);border-radius:14px;padding:12px;font:inherit;font-weight:700;cursor:pointer;transition:.2s}
.sell:hover:not(:disabled){color:var(--txt);border-color:rgba(255,255,255,.2)}
.sell:disabled{opacity:.35;cursor:not-allowed}
.banner{margin-top:14px;min-height:50px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:16px;padding:12px 16px;font-weight:700;font-size:14px;background:rgba(255,255,255,.03);border:1px solid var(--line);transition:.3s}
.banner.win{color:var(--win);border-color:rgba(61,220,132,.35);background:rgba(61,220,132,.09);box-shadow:0 0 30px -10px rgba(61,220,132,.5)}
.banner.lose{color:var(--lose);border-color:rgba(255,77,109,.35);background:rgba(255,77,109,.09)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 6px;text-align:center;cursor:pointer;display:grid;gap:4px;font:inherit;color:inherit;transition:transform .2s,border-color .2s,box-shadow .2s}
.item:hover:not(:disabled){transform:translateY(-2px);border-color:rgba(255,255,255,.2)}
.item .ico{font-size:28px;width:auto}
.item b{font-size:12px;font-weight:700}
.item .v{font-size:12px;color:var(--gold1);font-weight:800;font-variant-numeric:tabular-nums}
.item.sel{border-color:var(--gold2);box-shadow:0 0 0 1px var(--gold2),0 0 24px -4px rgba(255,170,43,.6)}
.ushop{display:grid;gap:8px}
.ushop .item{grid-template-columns:auto 1fr auto;text-align:left;align-items:center;padding:12px 14px}
.ushop .item .ico{font-size:24px}
.ushop .item:disabled{opacity:.42;cursor:not-allowed}
.price{font-weight:800;font-size:13px;color:var(--txt);background:rgba(255,255,255,.07);border-radius:999px;padding:6px 12px;font-variant-numeric:tabular-nums}
.ushop .item:hover:not(:disabled) .price{background:linear-gradient(90deg,var(--gold1),var(--gold2));color:#1a0d00}
.empty{color:var(--mut);font-size:13px;margin:0;text-align:center;padding:10px 0}

/* ===== НОВЫЙ ДИЗАЙН АПГРЕЙДЕРА ===== */
body:has(#v-up.on){background:#06060c}
body:has(#v-up.on)::before{background:radial-gradient(circle,#ff6b1a,transparent 65%);opacity:.26;top:-25vmax;left:-20vmax;animation-duration:14s}
body:has(#v-up.on)::after{background:radial-gradient(circle,#7c5cff,transparent 65%);opacity:.24}
#v-up .app{max-width:480px;gap:18px}
#v-up .u-title{display:grid;justify-items:center;gap:2px}
#v-up .u-title h1{font-size:1.2rem;letter-spacing:.1em;text-transform:uppercase;background:linear-gradient(100deg,#fff,#ffb020 45%,#ff4d6d);-webkit-background-clip:text;background-clip:text;color:transparent}
#v-up .u-title small{font-size:10px;color:var(--mut);letter-spacing:.16em;text-transform:uppercase}
#v-up .uhead{position:sticky;top:8px;z-index:5;padding:8px 10px;border-radius:999px;background:rgba(12,12,22,.55);border:1px solid var(--line);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:0 12px 30px -12px rgba(0,0,0,.7)}
#v-up .uhead .pill{box-shadow:0 0 0 1px rgba(255,170,43,.2),0 8px 24px -10px rgba(255,170,43,.6)}
#v-up .panel{position:relative;overflow:hidden;padding:24px 20px}
#v-up .gauge{width:min(290px,84vw);margin-top:6px}
#v-up .gauge::before{content:"";position:absolute;inset:6%;border-radius:50%;background:radial-gradient(circle,rgba(255,170,43,.25),transparent 65%);filter:blur(16px);animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45;transform:scale(1.06)}}
#v-up .gauge svg{position:relative;z-index:1;filter:drop-shadow(0 0 22px rgba(255,140,30,.35))}
#v-up #uNeedle path:first-child{filter:drop-shadow(0 0 6px rgba(255,255,255,.7))}
#v-up .pct{z-index:2}
#v-up .pct b{font-size:40px;filter:drop-shadow(0 0 14px rgba(255,170,43,.45))}
#v-up .cards{gap:12px;margin-top:18px}
#v-up .mini{border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.015));min-height:150px;position:relative;overflow:hidden}
#v-up .mini .ico{font-size:44px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5));animation:bob 3.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
#v-up .mini .v{font-size:18px;font-weight:900}
#v-up .mini.tgt{border-color:rgba(61,220,132,.3);background:linear-gradient(180deg,rgba(61,220,132,.14),rgba(61,220,132,.02));box-shadow:inset 0 0 40px -20px rgba(61,220,132,.6)}
#v-up .arrow{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt);font-size:18px}
#v-up .umult{display:block;padding:9px 14px;border-radius:999px;background:rgba(0,0,0,.25);border:1px solid var(--line);font-size:12.5px}
#v-up .chip[data-c="1"]{color:#e9d8ff}
#v-up .chip[data-c="1"]::before{content:"🎰 ";font-size:11px}
#v-up .chip[data-c="1"].on{background:linear-gradient(135deg,#c084fc,#7c5cff 45%,#ff5fd2);color:#fff;box-shadow:0 8px 24px -6px rgba(192,132,252,.9)}
#v-up .go{position:relative;overflow:hidden;padding:20px;border-radius:20px;font-size:17px;background:linear-gradient(100deg,#ff8a1f,#ff4d6d 50%,#7c5cff);background-size:200% 100%;box-shadow:0 18px 44px -14px rgba(255,95,110,.75)}
#v-up .go::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:sweep 2.8s ease-in-out infinite}
@keyframes sweep{0%,55%{left:-60%}100%{left:130%}}
#v-up .go:disabled{background:#2a2a3a}
#v-up .go:disabled::after{display:none}
#v-up .sell{border-radius:16px;margin-top:10px}
#v-up .banner{border-radius:18px;min-height:52px}
#v-up .grid{grid-template-columns:repeat(3,1fr);gap:12px}
#v-up .item{border-radius:18px;padding:14px 8px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015));position:relative;overflow:hidden}
#v-up .item .ico{font-size:32px}
#v-up .item .v{font-size:13px}
#v-up .item.sel{transform:translateY(-3px);border-color:rgba(255,176,32,.8)}
#v-up .item.sel::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(255,176,32,.25),transparent 70%);pointer-events:none}
#v-up .ushop .item{border-radius:16px;padding:12px 14px;background:rgba(255,255,255,.03)}
#v-up .ushop .item:hover:not(:disabled){transform:translateX(4px);border-color:rgba(255,176,32,.35)}
#v-up #uNeedle{filter:drop-shadow(0 0 8px rgba(255,255,255,.55))}
#v-up .gauge svg circle[r="98"]{transform-origin:100px 100px;animation:spin 40s linear infinite}
#v-up .rwheel{position:absolute;inset:7%;border-radius:50%;background:conic-gradient(#0f7a3a 0deg 9.73deg,transparent 9.73deg),repeating-conic-gradient(#c8102e 0deg 9.73deg,#111 9.73deg 19.46deg);box-shadow:inset 0 0 0 6px #b8862b,inset 0 0 0 9px #3a2a0e,0 0 40px rgba(255,170,43,.25),0 20px 40px rgba(0,0,0,.6);z-index:0;will-change:transform}
#v-up .rwheel::after{content:"";position:absolute;inset:30%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe27a,#8a5a12 60%,#2a1a05);box-shadow:0 4px 12px rgba(0,0,0,.6),inset 0 2px 4px rgba(255,255,255,.4)}
#v-up .rwheel::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.18) 0deg .4deg,transparent .4deg 9.73deg);pointer-events:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ===== КЛИКЕР ===== -->
<div class="view on" id="v-clicker">
  <div class="wrap">
    <div class="glass stage">
      <h1>Кликер Вселенная</h1>
      <div class="top">
        <div class="pill">⭐ <b id="stars">0</b></div>
        <button class="pbtn" id="btnUp">🎰 Апгрейдер</button>
        <button class="pbtn gold" id="btnRebirth">♻️ Перерождение</button>
      </div>
      <div class="score" id="score">0</div>
      <div class="rate" id="rate">0 / сек</div>
      <div id="goal"></div>
      <div class="coinWrap">
        <button id="coin" aria-label="Клик">🪙</button>
      </div>
      <div id="warn"></div>
    </div>

    <div>
      <div class="glass cpanel">
        <h2>🛒 Улучшения</h2>
        <div class="list" id="upgrades"></div>
      </div>
      <div class="glass cpanel" style="margin-top:20px">
        <h2>🌟 Звёздный магазин</h2>
        <div class="list" id="starShop"></div>
      </div>
    </div>
  </div>
</div>

<!-- ===== АПГРЕЙДЕР ===== -->
<div class="view" id="v-up">
  <div class="app">
    <div class="uhead">
      <button class="pbtn" id="btnBack">← Назад</button>
      <div class="u-title"><h1>Апгрейдер</h1><small>Рискни звёздами</small></div>

          <defs>

              <stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#ff6b1a"/>

          <path id="uZone" fill="none" stroke="url(#zone)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>

            <circle cx="100" cy="100" r="3" fill="#07070d"/>

      <h2>Магазин (за звёзды)</h2>
      <div class="ushop" id="uShop"></div>

  </div>
</div>

<script>
/* ===== ДАННЫЕ ===== */
const UPGRADES = [
  {id:'finger', ico:'👆', name:'Сильный палец', desc:'+1 за клик', type:'click', val:1, base:15},
  {id:'hammer', ico:'🔨', name:'Золотой молот', desc:'+5 за клик', type:'click', val:5, base:120},
  {id:'crit',   ico:'💥', name:'Критический удар', desc:'10% шанс ×5 за клик', type:'crit', base:400, max:1},
  {id:'drone',  ico:'🛸', name:'Дрон-сборщик', desc:'+2 в секунду', type:'auto', val:2, base:60},
  {id:'farm',   ico:'🌾', name:'Ферма монет', desc:'+12 в секунду', type:'auto', val:12, base:500},
  {id:'factory',ico:'🏭', name:'Фабрика', desc:'+60 в секунду', type:'auto', val:60, base:3000},
  {id:'portal', ico:'🌀', name:'Портал', desc:'+400 в секунду', type:'auto', val:400, base:25000},
  {id:'star',   ico:'⭐', name:'Звёздная фабрика', desc:'+3000 в секунду', type:'auto', val:3000, base:250000}
];

/* Звёздный магазин: покупки за звёзды, сохраняются после перерождения */
const STAR_ITEMS = [
  {id:'sclick', ico:'🌟', name:'Звёздный клик', desc:'Клики ×2', cost:5,   apply:'clickMult', val:2},
  {id:'planet', ico:'🪐', name:'Планета-ферма', desc:'+50 в секунду', cost:8,   apply:'auto', val:50},
  {id:'galaxy', ico:'🌌', name:'Галактика', desc:'+400 в секунду', cost:25,  apply:'auto', val:400},
  {id:'dragon', ico:'🐉', name:'Дракон-кладовая', desc:'+1500 в секунду', cost:80,  apply:'auto', val:1500},
  {id:'void',   ico:'🕳️', name:'Чёрная дыра', desc:'Клики ×3', cost:150, apply:'clickMult', val:3}
];

const MILESTONES = [{at:100, reward:500}, {at:1000, reward:1000}];
const REBIRTH_MIN = 5000;

const UP_SHOP = [
  {name:'Кепка', value:2, ico:'🧢'},
  {name:'Наушники', value:5, ico:'🎧'},
  {name:'Часы', value:10, ico:'⌚'},
  {name:'Кроссовки', value:20, ico:'👟'},
  {name:'Ноутбук', value:50, ico:'💻'}
];
const EDGE = 0.95;

/* ===== СОСТОЯНИЕ ===== */
const G = {score:0, totalClicks:0, claimed:new Set(), owned:{}, stars:10, starOwned:{}};
UPGRADES.forEach(u => G.owned[u.id] = 0);
const ug = {inv:[], selected:null, nextId:1, spinning:false, chance:50, angle:0};

/* ===== СОХРАНЕНИЕ ===== */
const SAVE_KEY = 'clicker-universe-save-v1';
const API = "http://localhost:5000"; // на телефоне замени на публичный HTTPS-адрес сервера

function applySave(d){
  G.score = d.score ?? 0;
  G.totalClicks = d.totalClicks ?? 0;
  G.stars = d.stars ?? 10;
  G.starOwned = d.starOwned || {};
  G.claimed = new Set(d.claimed || []);
  UPGRADES.forEach(u => G.owned[u.id] = (d.owned && d.owned[u.id]) || 0);
  ug.inv = d.inv || [];
  ug.selected = d.selected ?? null;
  ug.nextId = d.nextId || 1;
  ug.chance = d.chance || 50;
  ug.angle = d.angle || 0;
}

function gameData(){
  return {
    score:G.score, totalClicks:G.totalClicks, stars:G.stars,
    starOwned:G.starOwned, claimed:[...G.claimed], owned:G.owned,
    inv:ug.inv, selected:ug.selected, nextId:ug.nextId,
    chance:ug.chance, angle:ug.angle
  };
}

const tgApp = window.Telegram && window.Telegram.WebApp;
const tgUser = tgApp && tgApp.initDataUnsafe && tgApp.initDataUnsafe.user;

let playerId = tgUser ? String(tgUser.id) : localStorage.getItem('player-id');
if (!playerId){
  playerId = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  localStorage.setItem('player-id', playerId);
}

let gameLoaded = false; // пока не загрузили сохранение, ничего не записываем

function loadLocal(){
  try{
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (d) applySave(d);
  }catch(e){}
}

async function loadFromServer(){
  try{
    const r = await fetch(`${API}/api/load?player_id=${encodeURIComponent(playerId)}`);
    const { data } = await r.json();
    if (data) applySave(data);
    else loadLocal();
  }catch(e){
    loadLocal();
  }
  gameLoaded = true;
  renderClicker();
  uRender();
}

function saveAll(){
  if (!gameLoaded) return;
  const data = gameData();
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(data)); }catch(e){}
  fetch(`${API}/api/save`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ player_id: playerId, data }),
    keepalive: true
  }).catch(() => {});
}

/* ===== УТИЛИТЫ ===== */
const $ = id => document.getElementById(id);
const fmt = n => {
  if (n < 1000) return Math.floor(n).toString();
  const s = ['K','M','B','T','Qa','Qi'];
  let i = -1;
  while (n >= 1000 && i < s.length - 1){ n /= 1000; i++; }
  return n.toFixed(n < 10 ? 2 : n < 100 ? 1 : 0) + s[i];
};
const mod = (x, m) => ((x % m) + m) % m;

const cost = u => Math.floor(u.base * Math.pow(1.6, G.owned[u.id]));
const clickPower = () => 1 + UPGRADES.filter(u => u.type === 'click').reduce((a,u) => a + u.val * G.owned[u.id], 0);
const clickMult = () => STAR_ITEMS.reduce((m,s) => s.apply === 'clickMult' && G.starOwned[s.id] ? m * s.val : m, 1);
const critOn = () => G.owned.crit > 0;
const perSec = () =>
  UPGRADES.filter(u => u.type === 'auto').reduce((a,u) => a + u.val * G.owned[u.id], 0) +
  STAR_ITEMS.filter(s => s.apply === 'auto' && G.starOwned[s.id]).reduce((a,s) => a + s.val, 0);
const rebirthReward = () => Math.max(1, Math.floor(Math.sqrt(G.score / 500)));

function toast(text){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

function burst(x, y, text){
  const el = document.createElement('div');
  el.className = 'fx';
  el.textContent = text;
  el.style.left = (x - 10 + Math.random()*20) + 'px';
  el.style.top = (y - 20) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

function showView(name){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  $('v-' + name).classList.add('on');
  if (name === 'up') uRender();
  window.scrollTo(0, 0);
}

/* ===== КЛИКЕР: КНОПКИ ===== */
UPGRADES.forEach(u => {
  const b = document.createElement('button');
  b.className = 'up';
  b.id = 'up-' + u.id;
  b.innerHTML = `<span class="ico">${u.ico}</span>
    <span class="info"><b>${u.name}</b><small>${u.desc}</small><div class="lvl"></div></span>
    <span class="right"><span class="cost"></span></span>`;
  b.onclick = () => buyUpgrade(u);
  $('upgrades').appendChild(b);
});

STAR_ITEMS.forEach(s => {
  const b = document.createElement('button');
  b.className = 'up star';
  b.id = 'st-' + s.id;
  b.innerHTML = `<span class="ico">${s.ico}</span>
    <span class="info"><b>${s.name}</b><small>${s.desc}</small><div class="lvl"></div></span>
    <span class="right"><span class="cost">⭐ ${s.cost}</span></span>`;
  b.onclick = () => buyStar(s);
  $('starShop').appendChild(b);
});

function buyUpgrade(u){
  if (u.max && G.owned[u.id] >= u.max) return;
  const c = cost(u);
  if (G.score < c) return;
  G.score -= c;
  G.owned[u.id]++;
  burst(innerWidth / 2, innerHeight / 2, '🎉');
  renderClicker();
}

function buyStar(s){
  if (G.starOwned[s.id] || G.stars < s.cost) return;
  G.stars -= s.cost;
  G.starOwned[s.id] = true;
  toast(`${s.ico} Куплено: ${s.name}`);
  renderClicker();
}

function rebirth(){
  if (G.score < REBIRTH_MIN) return;
  const r = rebirthReward();
  if (!confirm(`Перерождение даст ${r} ⭐. Монеты, улучшения, клики и бонусы клика сбросятся. Продолжить?`)) return;
  G.stars += r;
  G.score = 0;
  G.totalClicks = 0;
  G.claimed.clear();
  UPGRADES.forEach(u => G.owned[u.id] = 0);
  toast(`♻️ Перерождение! +${r} ⭐`);
  renderClicker();
}

function renderClicker(){
  $('score').textContent = fmt(G.score);
  $('rate').textContent = fmt(perSec()) + ' / сек';
  $('stars').textContent = fmt(G.stars);
  const next = MILESTONES.find(m => !G.claimed.has(m.at));
  $('goal').textContent = next
    ? `Кликов: ${G.totalClicks} · Бонус на ${next.at}: +${next.reward}`
    : `Кликов: ${G.totalClicks} · Все бонусы получены 🎉`;

  const rb = $('btnRebirth');
  rb.disabled = G.score < REBIRTH_MIN;
  rb.textContent = G.score < REBIRTH_MIN
    ? `♻️ Перерождение (от ${fmt(REBIRTH_MIN)})`
    : `♻️ Перерождение +${rebirthReward()} ⭐`;

  UPGRADES.forEach(u => {
    const b = $('up-' + u.id);
    const maxed = u.max && G.owned[u.id] >= u.max;
    b.disabled = maxed || G.score < cost(u);
    b.querySelector('.lvl').textContent = maxed ? 'Куплено' : 'Уровень ' + G.owned[u.id];
    b.querySelector('.cost').textContent = maxed ? 'MAX' : fmt(cost(u));
  });

  STAR_ITEMS.forEach(s => {
    const b = $('st-' + s.id);
    const owned = !!G.starOwned[s.id];
    b.disabled = owned || G.stars < s.cost;
    b.querySelector('.lvl').textContent = owned ? 'Куплено' : '';
    b.querySelector('.cost').textContent = owned ? 'ВЗЯТО' : '⭐ ' + s.cost;
  });
}

$('btnUp').onclick = () => showView('up');
$('btnRebirth').onclick = rebirth;

/* ===== БОНУСЫ ЗА КЛИКИ ===== */
function checkMilestones(){
  MILESTONES.forEach(m => {
    if (G.totalClicks >= m.at && !G.claimed.has(m.at)){
      G.claimed.add(m.at);
      G.score += m.reward;
      toast(`🏆 ${m.at} кликов! Бонус +${fmt(m.reward)}`);
    }
  });
}

/* ===== АНТИ-АВТОКЛИКЕР ===== */
const clickTimes = [];
let fastStreak = 0, lockUntil = 0, lockTimer = null;

function isBot(now){
  clickTimes.push(now);
  if (clickTimes.length > 12) clickTimes.shift();
  if (clickTimes.length >= 2){
    const gap = now - clickTimes[clickTimes.length - 2];
    fastStreak = gap < 45 ? fastStreak + 1 : 0;
  }
  if (fastStreak >= 4) return true;
  if (clickTimes.length === 12){
    const gaps = [];
    for (let i = 1; i < clickTimes.length; i++) gaps.push(clickTimes[i] - clickTimes[i-1]);
    const mean = gaps.reduce((a,b) => a + b, 0) / gaps.length;
    const sd = Math.sqrt(gaps.reduce((a,g) => a + (g - mean) ** 2, 0) / gaps.length);
    if (mean < 400 && sd < 6) return true;
  }
  return false;
}

function lockOut(){
  lockUntil = performance.now() + 3000;
  clickTimes.length = 0;
  fastStreak = 0;
  const coin = $('coin');
  coin.classList.add('locked');
  let left = 3;
  $('warn').textContent = `🤖 Автокликер обнаружен! Ожидание ${left} сек`;
  clearInterval(lockTimer);
  lockTimer = setInterval(() => {
    left--;
    if (left > 0) $('warn').textContent = `🤖 Автокликер обнаружен! Ожидание ${left} сек`;
    else {
      clearInterval(lockTimer);
      coin.classList.remove('locked');
      $('warn').textContent = '';
    }
  }, 1000);
}

/* ===== КЛИК ===== */
$('coin').addEventListener('pointerdown', e => {
  if (!e.isTrusted) return;
  const now = performance.now();
  if (now < lockUntil) return;
  if (isBot(now)){ lockOut(); return; }

  let gain = clickPower() * clickMult();
  let crit = false;
  if (critOn() && Math.random() < 0.1){ gain *= 5; crit = true; }
  G.score += gain;
  G.totalClicks++;
  checkMilestones();

  const coin = $('coin');
  coin.classList.remove('hit'); void coin.offsetWidth; coin.classList.add('hit');
  burst(e.clientX, e.clientY, (crit ? '💥 ' : '+') + fmt(gain));
  renderClicker();
});

/* ===== АПГРЕЙДЕР ===== */
const uMult = () => ug.chance === 1 ? 100000 : EDGE * 100 / ug.chance;

function uDrawGauge(){
  const pt = d => { const f = d * Math.PI / 180; return [100 + 80 * Math.sin(f), 100 - 80 * Math.cos(f)]; };
  const end = ug.chance * 3.6;
  const [x1, y1] = pt(0), [x2, y2] = pt(end);
  $('uZone').setAttribute('d', `M${x1},${y1} A80,80 0 ${end > 180 ? 1 : 0} 1 ${x2},${y2}`);
  $('uPct').textContent = ug.chance + '%';
}

function uSetResult(text, cls){
  const r = $('uResult');
  r.textContent = text;
  r.className = 'banner' + (cls ? ' ' + cls : '');
}

function uRender(){
  $('uStars').textContent = fmt(G.stars);
  const it = ug.inv.find(i => i.id === ug.selected);
  $('uStake').innerHTML = it
    ? `<small>Ваша ставка</small><span class="ico">${it.ico}</span><b>${it.name}</b><span class="v">⭐ ${fmt(it.value)}</span>`
    : `<small>Ваша ставка</small><span class="ico">❔</span><b>Не выбрано</b>`;
  $('uTarget').innerHTML = it
    ? `<small>Цель</small><span class="ico">🎯</span><b>При удаче</b><span class="v">⭐ ${fmt(it.value * uMult())}</span>`
    : `<small>Цель</small><span class="ico">🎯</span><b>—</b>`;
  const m = uMult().toLocaleString('ru-RU', {maximumFractionDigits: 2});
  $('uMult').innerHTML = `Множитель при удаче: <b>×${m}</b>. При провале предмет пропадает.`;
  uDrawGauge();
  document.querySelectorAll('#uChips .chip').forEach(b => {
    b.classList.toggle('on', +b.dataset.c === ug.chance);
    b.disabled = ug.spinning;
  });
  $('uSpin').disabled = !it || ug.spinning;
  $('uSell').disabled = !it || ug.spinning;
  $('uEmpty').textContent = ug.inv.length ? '' : 'Инвентарь пуст. Купи предмет в магазине.';

  const inv = $('uInv');
  inv.innerHTML = '';
  ug.inv.forEach(i => {
    const d = document.createElement('button');
    d.className = 'item' + (i.id === ug.selected ? ' sel' : '');
    d.innerHTML = `<span class="ico">${i.ico}</span><b>${i.name}</b><span class="v">⭐ ${fmt(i.value)}</span>`;
    d.onclick = () => { if (!ug.spinning){ ug.selected = i.id; uRender(); } };
    inv.appendChild(d);
  });

  document.querySelectorAll('#uShop .item').forEach((b, idx) => {
    b.disabled = G.stars < UP_SHOP[idx].value;
  });
}

function uBuy(s){
  if (ug.spinning) return;
  if (G.stars < s.value){
    uSetResult('Не хватает звёзд', 'lose');
    return;
  }
  G.stars -= s.value;
  ug.inv.push({id: ug.nextId++, name: s.name, value: s.value, ico: s.ico});
  uSetResult('Куплено: ' + s.name);
  uRender();
}

function uSpin(){
  const it = ug.inv.find(i => i.id === ug.selected);
  if (!it || ug.spinning) return;
  ug.spinning = true;
  uRender();
  uSetResult('Прокачка...');

  const c = ug.chance;
  const roll = Math.random() * 100;
  const win = roll < c;

  const needle = $('uNeedle');
  const start = ug.angle;
  const target = roll * 3.6;
  const turns = 4 + Math.floor(Math.random() * 4);
  const D = mod(target - start, 360) + 360 * turns;
  const dur = 3500 + Math.random() * 1500;
  const t0 = performance.now();
  const ease = t => 1 - Math.pow(1 - t, 4);
  needle.style.transition = 'none';

  function frame(now){
    const t = Math.min(1, (now - t0) / dur);
    needle.style.transform = `rotate(${start + D * ease(t)}deg)`;
    $('uWheel').style.transform = `rotate(${-(start + D * ease(t)) * 0.5}deg)`;
    if (t < 1) requestAnimationFrame(frame);
    else {
      ug.angle = start + D;
      setTimeout(() => uFinish(it, win, roll, c), 200);
    }
  }
  requestAnimationFrame(frame);
}

function uFinish(it, win, roll, c){
  ug.spinning = false;
  if (win){
    const jackpot = c === 1;
    it.value = Math.round(it.value * uMult());
    if (jackpot){
      toast('🎰 ДЖЕКПОТ! ×100 000');
      uSetResult(`🎰 ДЖЕКПОТ! Предмет теперь стоит ⭐ ${fmt(it.value)}`, 'win');
    } else {
      uSetResult(`🎉 Удача! Предмет теперь стоит ⭐ ${fmt(it.value)}`, 'win');
    }
  } else {
    ug.inv = ug.inv.filter(i => i.id !== it.id);
    ug.selected = null;
    uSetResult(`💥 Провал (выпало ${roll.toFixed(1)}, нужно меньше ${c}). Предмет потерян.`, 'lose');
  }
  uRender();
}

function uSell(){
  const it = ug.inv.find(i => i.id === ug.selected);
  if (!it || ug.spinning) return;
  G.stars += it.value;
  ug.inv = ug.inv.filter(i => i.id !== it.id);
  ug.selected = null;
  uSetResult(`Продано за ⭐ ${fmt(it.value)}`);
  uRender();
}

UP_SHOP.forEach(s => {
  const b = document.createElement('button');
  b.className = 'item';
  b.innerHTML = `<span class="ico">${s.ico}</span><div><b>${s.name}</b></div><span class="price">⭐ ${fmt(s.value)}</span>`;
  b.onclick = () => uBuy(s);
  $('uShop').appendChild(b);
});

document.querySelectorAll('#uChips .chip').forEach(b => {
  b.onclick = () => { if (!ug.spinning){ ug.chance = +b.dataset.c; uRender(); } };
});
$('uSpin').onclick = uSpin;
$('uSell').onclick = uSell;
$('btnBack').onclick = () => showView('clicker');

/* ===== ИГРОВОЙ ЦИКЛ ===== */
setInterval(() => {
  const rate = perSec();
  if (rate > 0) G.score += rate / 10;
  renderClicker();
}, 100);

/* ===== ЗАПУСК ===== */
if (tgApp){ tgApp.ready(); tgApp.expand(); }

loadFromServer();
setInterval(saveAll, 2000);
