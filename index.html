<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Главное меню</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0e1116;
    --card: #171c24;
    --text: #f2f4f7;
    --muted: #8a93a3;
    --accent: #3ddc84;
    --nav-h: 72px;
    --top-h: 72px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  /* ---------- Верхняя панель ---------- */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--top-h);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg);
    z-index: 10;
  }

  .balance {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--card);
    border-radius: 999px;
    padding: 8px 16px 8px 10px;
    font-weight: 700;
    font-size: 16px;
  }
  .balance .coin {
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; color: #7a4f00;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffe27a, #e0a100);
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.25);
  }

  .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    background: #22303f center/cover no-repeat;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    color: var(--text);
    overflow: hidden;
  }

  /* ---------- Контент ---------- */
  .content {
    position: fixed;
    top: var(--top-h);
    bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
    left: 0; right: 0;
    overflow-y: auto;
    padding: 8px 16px 16px;
  }

  .section { display: none; }
  .section.active { display: block; }

  .section h2 {
    font-size: 22px;
    margin: 4px 0 14px;
  }

  .placeholder {
    background: var(--card);
    border-radius: 16px;
    padding: 28px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 15px;
  }

  /* ---------- Сетка игр ---------- */
  .games-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .game-tile {
    aspect-ratio: 1 / 1.1;
    border-radius: 18px;
    border: none;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    color: #fff;
    transition: transform .15s ease;
    box-shadow: 0 6px 16px rgba(0,0,0,.35);
  }
  .game-tile:active { transform: scale(.96); }

  .game-tile .label {
    position: absolute;
    left: 0; right: 0; bottom: 10px;
    text-align: center;
    font-weight: 700;
    font-size: 15px;
    text-shadow: 0 1px 3px rgba(0,0,0,.35);
    z-index: 2;
  }

  /* Иконка занимает большую часть плитки */
  .game-tile .art {
    position: absolute;
    top: 2%; left: 50%;
    transform: translateX(-50%);
    width: 100%;
    height: 76%;
    z-index: 1;
  }
  .game-tile .art svg { width: 100%; height: 100%; display: block; overflow: visible; }

  .game-tile.locked { filter: grayscale(.7) brightness(.8); cursor: default; }
  .game-tile.locked::after {
    content: "Скоро";
    position: absolute;
    top: 8px; right: 8px;
    font-size: 10px;
    background: rgba(0,0,0,.45);
    padding: 3px 7px;
    border-radius: 999px;
    z-index: 2;
  }

  .tile-plinko { background: linear-gradient(180deg, #ffd65a 0%, #ffb12e 60%, #f08c1a 100%); }
  .tile-mines  { background: linear-gradient(180deg, #5fe39a 0%, #2fb86a 60%, #1f8f52 100%); }
  .tile-blue   { background: linear-gradient(180deg, #6fb6ff, #2f6fd1); }
  .tile-purple { background: linear-gradient(180deg, #b48bff, #6d3fd6); }

  /* ---------- Нижняя навигация ---------- */
  .bottomnav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: var(--card);
    border-top: 1px solid #222a35;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    z-index: 10;
  }

  .nav-btn {
    background: none;
    border: none;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-size: 12px;
    cursor: pointer;
    transition: color .2s;
  }
  .nav-btn .ico { font-size: 22px; line-height: 1; }
    .nav-btn.active { color: var(--accent); }

  /* ---------- Вкладка «Другое» ---------- */
  .menu-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px 10px;
    padding-top: 6px;
  }
  .menu-item {
    background: none; border: none; color: var(--text);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    cursor: pointer; font-size: 12px; font-family: inherit;
  }
  .menu-item .ico-box {
    width: 58px; height: 58px;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,.35);
  }
  .menu-item .ico-box svg { width: 28px; height: 28px; }
  .menu-item:active .ico-box { transform: scale(.94); }
  /* ---------- Экран игры ---------- */
  .game-screen {
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 20;
    display: none;
  }
  .game-screen.show { display: block; }
  .game-screen iframe { width: 100%; height: 100%; border: 0; display: block; }
  /* ---------- Модальное окно ---------- */
  .modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.65);
    display: none; align-items: center; justify-content: center;
    padding: 20px; z-index: 30;
  }
  .modal.show { display: flex; }
  .modal-box {
    width: 100%; max-width: 360px;
    background: #1c1f26;
    border: 1px solid #3a4150;
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  .modal-title { font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 14px; }
  .modal-content { margin-bottom: 16px; }
  .modal-text { white-space: pre-line; font-size: 14px; line-height: 1.5; color: #e8e8ea; }
  .modal-back {
    width: 100%; border: 0; border-radius: 12px; padding: 14px;
    background: #8e3a2f; color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .modal-back:active { transform: scale(.98); }

  .settings-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .set-btn {
    border: 1px solid #b85a4e; border-radius: 10px;
    background: #9c3b31; color: #fff;
    padding: 14px 8px; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .set-btn.wide { grid-column: 1 / -1; }

  .promo-input {
    width: 100%; padding: 12px; margin-bottom: 10px;
    border-radius: 10px; border: 1px solid #3a4150;
    background: #22252d; color: #fff;
    font-size: 16px; font-family: inherit; text-transform: uppercase;
  }
  .modal-action {
    width: 100%; border: 0; border-radius: 10px; padding: 12px;
    background: #30a46c; color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .promo-result { margin-top: 12px; font-size: 14px; line-height: 1.4; min-height: 20px; text-align: center; }
  .promo-result.ok { color: #5be39a; }
  .promo-result.err { color: #ff8a80; }
  /* ---------- Профиль ---------- */
  .prof-row { display: flex; gap: 10px; align-items: center; font-size: 15px; line-height: 1.5; color: #e8e8ea; }
  .prof-row b { color: #fff; font-weight: 700; }
  .prof-ico { width: 22px; text-align: center; flex-shrink: 0; }
  .prof-sep { border: 0; border-top: 1px solid #3a4150; margin: 10px 0; }
  .xp-bar { height: 10px; background: #2a2f3a; border-radius: 6px; overflow: hidden; margin: 8px 0 12px; }
  .xp-fill { height: 100%; background: linear-gradient(90deg, #3ddc84, #2fb86a); border-radius: 6px; }

  /* ---------- Криптовалюта ---------- */
  .crypto-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .crypto-price { font-size: 20px; font-weight: 700; color: #fff; }
  .crypto-change { font-size: 14px; font-weight: 700; }
  .crypto-change.up { color: #5be39a; }
  .crypto-change.down { color: #ff8a80; }
  .chart-box { background: #15181f; border: 1px solid #2a2f3a; border-radius: 12px; padding: 8px; }
  .chart-box svg { display: block; width: 100%; height: auto; }
  .crypto-note { font-size: 11px; color: #8a93a3; text-align: center; margin-top: 8px; }
  /* ---------- Торговля BUB ---------- */
  .crypto-stats { font-size: 13px; line-height: 1.7; color: #c9ced8; background: #15181f; border: 1px solid #2a2f3a; border-radius: 12px; padding: 10px 12px; margin: 12px 0; }
  .crypto-stats b { color: #fff; }
  .pl-up { color: #5be39a !important; }
  .pl-down { color: #ff8a80 !important; }
  .trade-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .buy-btn, .sell-btn { border: 0; border-radius: 10px; padding: 12px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .buy-btn { background: #30a46c; }
  .sell-btn { background: #e5484d; }
  .buy-btn:active, .sell-btn:active { transform: scale(.98); }
  /* ---------- Таймфреймы ---------- */
  .tf-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .tf-btn {
    flex: 1; border: 0; border-radius: 8px; padding: 8px 0;
    background: #22252d; color: #c9ced8;
    font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .tf-btn.active { background: #2f8cff; color: #fff; }
</style>
</head>

<script>
  // ---- Telegram ----
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  // ---- Аватар и имя ----
  const avatarEl = document.getElementById('avatar');
  const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (user && user.photo_url) {
    avatarEl.style.backgroundImage = `url("${user.photo_url}")`;
    avatarEl.textContent = '';
  } else if (user && user.first_name) {
    avatarEl.textContent = user.first_name[0].toUpperCase();
  } else {
    avatarEl.textContent = 'Я';
  }

  // ---- Баланс ----
  const _saved = localStorage.getItem('balance');
  let balance = _saved !== null ? +_saved : 1000;
  function renderBalance() {
    localStorage.setItem('balance', balance);
    document.getElementById('balance').textContent = balance.toLocaleString('ru-RU');
  }
  renderBalance();

  // ---- Переключение вкладок ----
  const navButtons = document.querySelectorAll('.nav-btn');
  const sections = document.querySelectorAll('.section');

  navButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.tab;
      navButtons.forEach(b => b.classList.toggle('active', b === btn));
      sections.forEach(s => s.classList.toggle('active', s.id === target));
      if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
    });
  });

\/button>\n      <button class=\"btn\" data-v=\"max\">МАКС<\/button>\n    <\/div>\n  <\/div>\n\n  <div class=\"total\" id=\"total\"><\/div>\n  <button class=\"btn start\" id=\"action\">Играть<\/button>\n<\/div>\n\n<script>\nconst ROWS = 14, SP = 100 / 17, STEP = 10, START_BALANCE = 1000;\nconst MULTS = [20, 10, 5, 2.5, 2, 1.5, 1.2, 0, 1.2, 1.5, 2, 2.5, 5, 10, 20];\nconst _saved = localStorage.getItem('balance');\nlet balance = _saved !== null ? +_saved : START_BALANCE, balls = 1, bet = 10;\n\nconst $ = id => document.getElementById(id);\nconst COIN = '<span class=\"coin\"><\/span>';\nconst fmt = n => n.toLocaleString('ru-RU');\nconst setMsg = t => $('msg').innerHTML = t;\nconst board = $('board');\nconst ballsBox = $('balls');\n\nfunction rowY(r) { return 8 + r * 5.2; }\n\nfunction colorFor(m) {\n  if (m >= 10) return '#13b48a';\n  if (m >= 5) return '#7cc13a';\n  if (m >= 2.5) return '#e8b923';\n  if (m >= 2) return '#f08a2b';\n  if (m >= 1.5) return '#ef5350';\n  if (m >= 1.2) return '#b83a3e';\n  return '#5b5f6b';\n}\n\n// колышки\nfor (let r = 0; r < ROWS; r++) {\n  const k = r + 3;\n  for (let j = 0; j < k; j++) {\n    const p = document.createElement('div');\n    p.className = 'peg';\n    p.style.left = (50 + (j - (k - 1) / 2) * SP) + '%';\n    p.style.top = rowY(r) + '%';\n    board.appendChild(p);\n  }\n}\n\n// ячейки множителей\nconst bins = MULTS.map((m, k) => {\n  const d = document.createElement('div');\n  d.className = 'bin';\n  d.style.left = (50 + (k - 7) * SP) + '%';\n  d.style.background = colorFor(m);\n  d.textContent = m + 'x';\n  board.appendChild(d);\n  return d;\n});\n\n// кнопки количества мячей\nfor (let n = 1; n <= 8; n++) {\n  const b = document.createElement('button');\n  b.className = 'btn';\n  b.textContent = n;\n  b.onclick = () => { balls = n; bet = Math.min(bet, maxBet()); render(); };\n  ballsBox.appendChild(b);\n}\n\nfunction maxBet() {\n  return Math.max(STEP, Math.floor(balance / balls / STEP) * STEP);\n}\nfunction setBet(v) {\n  bet = Math.max(STEP, Math.min(Math.round(v), maxBet()));\n  render();\n}\n\n$('minus').onclick = () => setBet(bet - STEP);\n$('plus').onclick = () => setBet(bet + STEP);\ndocument.querySelectorAll('.quick button').forEach(b => {\n  b.onclick = () => setBet(b.dataset.v === 'max' ? maxBet() : +b.dataset.v);\n});\n$('action').onclick = play;\n\nfunction render() {\n  localStorage.setItem('balance', balance);\n  $('balance').innerHTML = fmt(balance) + COIN;\n  $('bet').innerHTML = fmt(bet) + COIN;\n  $('total').innerHTML = 'Итого: <b>' + fmt(bet * balls) + '<\/b>' + COIN;\n  [...ballsBox.children].forEach((b, i) => b.classList.toggle('sel', i + 1 === balls));\n  $('action').disabled = bet * balls > balance;\n}\n\nfunction play() {\n  const total = bet * balls;\n  if (total > balance) return;\n  balance -= total;\n  render();\n  for (let i = 0; i < balls; i++) {\n    setTimeout(dropBall, i * 300);\n  }\n}\n\nfunction dropBall() {\n  // 60% мячей падают в ячейку 0x (индекс 7), остальные 40% — в любую другую ячейку\n  let k;\n  if (Math.random() < 0.6) {\n    k = 7;\n  } else {\n    do { k = Math.floor(Math.random() * MULTS.length); } while (k === 7);\n  }\n\n  // k ходов вправо и остальные влево, перемешанные случайно — путь ведёт ровно в выбранную ячейку\n  const moves = [];\n  for (let r = 0; r < ROWS; r++) moves.push(r < k ? 1 : 0);\n  for (let r = ROWS - 1; r > 0; r--) {\n    const j = Math.floor(Math.random() * (r + 1));\n    [moves[r], moves[j]] = [moves[j], moves[r]];\n  }\n\n  let pos = 0;\n  const path = [];\n  for (let r = 0; r < ROWS; r++) {\n    pos += moves[r];\n    path.push([50 + (pos - (r + 1) / 2) * SP, rowY(r) + 2.6]);\n  }\n\n  const ball = document.createElement('div');\n  ball.className = 'ball';\n  ball.style.left = '50%';\n  ball.style.top = '2%';\n  board.appendChild(ball);\n\n  let i = 0;\n  const step = () => {\n    if (i < path.length) {\n      ball.style.left = path[i][0] + '%';\n      ball.style.top = path[i][1] + '%';\n      i++;\n      setTimeout(step, 140);\n    } else {\n      land(k, ball);\n    }\n  };\n  setTimeout(step, 30);\n}\n\nfunction land(k, ball) {\n  const m = MULTS[k];\n  const win = Math.floor(bet * m);\n  balance += win;\n  render();\n  setMsg('Выигрыш: ' + fmt(win) + COIN + ' (' + m + 'x)');\n\n  const bin = bins[k];\n  bin.classList.add('hit');\n  setTimeout(() => bin.classList.remove('hit'), 250);\n\n  setTimeout(() => { ball.style.opacity = 0; }, 150);\n  setTimeout(() => ball.remove(), 500);\n\n  if (balance < STEP) {\n    balance = START_BALANCE;\n    setMsg('Баланс пополнен');\n    render();\n  }\n}\n\nrender();\n<\/script>\n<\/body>\n<\/html>\n","mines": "<!DOCTYPE html>\n<html lang=\"ru\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Минное поле<\/title>\n<style>\n:root{--bg:#0f1115;--panel:#1a1c22;--cell:#22252d;--cell-h:#2b2f39;--text:#e8e8ea;--muted:#8a8f9c;--accent:#2f8cff;--green:#30a46c;--red:#e5484d}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px 12px}\n.wrap{width:100%;max-width:380px}\n.info{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:12px;min-height:20px}\n.info b{color:var(--text)}\n.back{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:#22252d;color:#e8e8ea;text-decoration:none;font-size:20px;margin-bottom:12px}\n.back:hover{background:#2b2f39}\n.board{background:var(--panel);border-radius:16px;padding:12px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}\n.board.shake{animation:shake .4s}\n@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}\n.cell{aspect-ratio:1;border:0;border-radius:10px;background:var(--cell);cursor:pointer;display:f ;width:14%;height:100%;background:#fff;border-radius:8px;transform:translate(-50%,-50%) scale(0)}\n.overlay.show .cross i:first-child{animation:x1 .22s forwards}\n.overlay.show .cross i:last-child{animation:x2 .22s .06s forwards}\n@keyframes x1{to{transform:translate(-50%,-50%) rotate(45deg) scale(1)}}\n@keyframes x2{to{transform:translate(-50%,-50%) rotate(-45deg) scale(1)}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <a class=\"back\" href=\"#\" onclick=\"parent.closeGame();return false;\">←<\/a>\n  <div class=\"info\">\n    <span>Баланс: <b id=\"balance\"><\/b><\/span>\n    <span id=\"msg\"><\/span>\n  <\/div>\n\n  <div class=\"board\" id=\"board\"><\/div>\n\n  <div class=\"row\">\n    <div class=\"label\">Количество мин<\/div>\n    <div class=\"mines\" id=\"mines\"><\/div>\n  <\/div>\n\n  <div class=\"row\">\n    <div class=\"label\">Ставка<\/div>\n    <div class=\"bet\">\n      <button class=\"btn arrow\" id=\"minus\">−<\/button>\n      <div class=\"val\" id=\"bet\"><\/div>\n      <button class=\"btn arrow\" id=\"plus\">+<\/button>\n    <\/div>\n    <div class=\"quick\">\n      <button class=\"btn\" data-v=\"10\">10<\/button>\n      <button class=\"btn\" data-v=\"50\">50<\/button>\n      <button class=\"btn\" data-v=\"100\">100<\/button>\n      <button class=\"btn\" data-v=\"max\">МАКС<\/button>\n    <\/div>\n  <\/div>\n\n  <button class=\"btn start\" id=\"action\"><\/button>\n<\/div>\n\n<div class=\"overlay\" id=\"overlay\"><div class=\"cross\"><i><\/i><i><\/i><\/div><\/div>\n\n<script>\nconst N = 25, STEP = 10, START_BALANCE = 1000;\nconst _saved = localStorage.getItem('balance');\nlet balance = _saved !== null ? +_saved : START_BALANCE, mines = 1, bet = 10;\nlet playing = false, done = false, opened = 0;\nlet minePos = new Set();\n\nconst $ = id => document.getElementById(id);\nconst board = $('board');\nconst minesBox = $('mines');\nconst cells = [];\n\nfor (let i = 0; i < N; i++) {\n  const b = document.createElement('button');\n  b.className = 'cell';\n  b.onclick = () => pick(i);\n  board.appendChild(b);\n  cells.push(b);\n}\n\nfor (let m = 1; m <= 8; m++) {\n  const b = document.createElement('button');\n  b.className = 'btn';\n  b.textContent = m;\n  b.onclick = () => { if (!playing) { mines = m; render(); } };\n  minesBox.appendChild(b);\n}\n\ndocument.querySelectorAll('.quick button').forEach(b => {\n  b.onclick = () => setBet(b.dataset.v === 'max' ? balance : +b.dataset.v);\n});\n$('minus').onclick = () => setBet(bet - STEP);\n$('plus').onclick = () => setBet(bet + STEP);\n$('action').onclick = () => playing ? cashout() : start();\n\nconst COIN = '<span class=\"coin\"><\/span>';\nconst fmt = n => n.toLocaleString('ru-RU');\nconst setMsg = t => $('msg').innerHTML = t;\n\n// множитель после k открытых алмазов\nfunction mult(k) {\n  let x = 1;\n  for (let i = 0; i < k; i++) x *= (N - i) / (N - mines - i);\n  return x;\n}\nfunction winAmount() { return Math.floor(bet * mult(opened)); }\n\nfunction setBet(v) {\n  bet = Math.max(STEP, Math.min(Math.round(v), Math.max(balance, STEP)));\n  render();\n}\n\nfunction render() {\n  localStorage.setItem('balance', balance);\n  $('balance').innerHTML = fmt(balance) + COIN;\n  $('bet').innerHTML = fmt(bet) + COIN;\n  [...minesBox.children].forEach((b, idx) => {\n    b.classList.toggle('sel', idx + 1 === mines);\n    b.disabled = playing;\n  });\n  document.querySelectorAll('.quick button, .arrow').forEach(b => b.disabled = playing);\n  const btn = $('action');\n  if (!playing) {\n    btn.textContent = 'Начать';\n    btn.className = 'btn start';\n    btn.disabled = bet > balance;\n  } else {\n    btn.innerHTML = 'Забрать ' + fmt(winAmount()) + COIN;\n    btn.className = 'btn start cash';\n    btn.disabled = opened === 0;\n  }\n}\n\nfunction resetBoard() {\n  cells.forEach(c => {\n    c.className = 'cell';\n    c.innerHTML = '';\n    c.disabled = true;\n  });\n}\n\nfunction start() {\n  if (bet > balance) return;\n  balance -= bet;\n  playing = true; done = false; opened = 0;\n  minePos = new Set();\n  while (minePos.size < mines) minePos.add(Math.floor(Math.random() * N));\n  resetBoard();\n  cells.forEach(c => c.disabled = false);\n  setMsg('Выбирай клетки');\n  render();\n}\n\nfunction pick(i) {\n  if (!playing || done || cells[i].disabled) return;\n  if (minePos.has(i)) { boom(i); return; }\n\n  cells[i].disabled = true;\n  cells[i].classList.add('gem');\n  cells[i].innerHTML = '<span class=\"icon\">💎<\/span>';\n  opened++;\n\n  if (opened === N - mines) {\n    setMsg('Все алмазы найдены!');\n    cashout();\n    return;\n  }\n  setMsg('Алмазов: ' + opened);\n  render();\n}\n\nfunction revealMines() {\n  cells.forEach((c, i) => {\n    c.disabled = true;\n    if (minePos.has(i) && !c.classList.contains('bomb')) {\n      c.classList.add('mined');\n      c.innerHTML = '<span class=\"icon\">💣<\/span>';\n    }\n  });\n}\n\nfunction cashout() {\n  const w = winAmount();\n  balance += w;\n  playing = false;\n  revealMines();\n  setMsg('Выигрыш: ' + fmt(w) + COIN);\n  render();\n}\n\nfunction boom(i) {\n  done = true;\n  playing = false;\n  cells[i].classList.add('bomb');\n  cells[i].innerHTML = '<span class=\"icon\">💣<\/span>';\n  revealMines();\n  setMsg('Бум!');\n  render();\n\n  board.classList.add('shake');\n  setTimeout(() => $('overlay').classList.add('show'), 150);\n  setTimeout(() => {\n    $('overlay').classList.remove('show');\n    board.classList.remove('shake');\n    toSetup();\n  }, 2300);\n}\n\nfunction toSetup() {\n  if (balance < STEP) balance = START_BALANCE;\n  resetBoard();\n  setBet(bet);\n  setMsg('Выбери мины и ставку');\n  render();\n}\n\ntoSetup();\n<\/script>\n<\/body>\n<\/html>\n"};
  // ---- Открытие и закрытие игр ----
  const gameScreen = document.getElementById('gameScreen');
  const gameFrame = document.getElementById('gameFrame');

  function openGame(name) {
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    gameFrame.srcdoc = GAMES[name];
    gameScreen.classList.add('show');
  }

  function closeGame() {
    gameScreen.classList.remove('show');
    gameFrame.srcdoc = '';
    // обновляем баланс после игры
    const s = localStorage.getItem('balance');
    if (s !== null) balance = +s;
    renderBalance();
  }
  window.closeGame = closeGame;

  // ---- Модальное окно ----
  const modal = document.getElementById('modal');
  const modalTitle = document.getElementById('modalTitle');
  const modalContent = document.getElementById('modalContent');
  const modalBack = document.getElementById('modalBack');

  function openModal(title, contentEl, onBack) {
    modalTitle.textContent = title;
    modalContent.innerHTML = '';
    modalContent.appendChild(contentEl);
    modalBack.onclick = onBack || closeModal;
    modal.classList.add('show');
  }
  function closeModal() { modal.classList.remove('show'); }
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

  function textBlock(text) {
    const d = document.createElement('div');
    d.className = 'modal-text';
    d.textContent = text;
    return d;
  }

  // ---- Промокоды ----
  // reward — сколько Бубов начислить; expired: true — срок истёк
  const PROMOS = {
    'WELCOME500': { reward: 500 },
    'BUBY1000':   { reward: 1000 },
    'SUMMER2024': { expired: true },
  };

  function getUsedPromos() {
    try { return JSON.parse(localStorage.getItem('usedPromos')) || []; }
    catch (e) { return []; }
  }

  function applyPromo(raw) {
    const code = raw.trim().toUpperCase();
    if (!code) return { ok: false, msg: 'Введи промокод.' };
    const promo = PROMOS[code];
    if (!promo) return { ok: false, msg: 'Такого промокода нет. Проверь, правильно ли ты его написал.' };
    const used = getUsedPromos();
    if (used.includes(code)) return { ok: false, msg: 'Этот промокод уже использован. Повторно его ввести нельзя.' };
    if (promo.expired) return { ok: false, msg: 'Срок действия этого промокода истёк.' };

    used.push(code);
    localStorage.setItem('usedPromos', JSON.stringify(used));
    balance += promo.reward;
    renderBalance();
    return { ok: true, msg: `Промокод активирован! Начислено ${promo.reward} Бубов.` };
  }

  function openPromo() {
    const wrap = document.createElement('div');

    const intro = textBlock('Введи промокод, и если он действующий, бонус сразу придёт на баланс.');

    const input = document.createElement('input');
    input.className = 'promo-input';
    input.placeholder = 'Например, WELCOME500';
    input.maxLength = 32;
    input.autocomplete = 'off';

    const btn = document.createElement('button');
    btn.className = 'modal-action';
    btn.textContent = 'Активировать';

    const result = document.createElement('div');
    result.className = 'promo-result';

    btn.onclick = () => {
      const r = applyPromo(input.value);
      result.textContent = r.msg;
      result.className = 'promo-result ' + (r.ok ? 'ok' : 'err');
      if (r.ok) input.value = '';
    };

    wrap.append(intro, input, btn, result);
    openModal('🎟️ Промокод', wrap);
    setTimeout(() => input.focus(), 50);
  }

  // ---- Настройки ----
  const INFO = {
    about: {
      title: '💎 О Бубах',
      text: `💎 Бубы — это внутренняя валюта нашего бота.

⚠️ Важная информация

✨ Копи, играй, зарабатывай — и получай удовольствие!`
    },
    game: {
      title: '🎮 Об игре',
      text: `🌍 Добро пожаловать в Ylola World!

    },
    privacy: {
      title: '🔒 Приватность',
      text: `🔒 Конфиденциальность

📝 Никнейм, указанный при регистрации

🚫 Чего у нас НЕТ:

    }
  };

  function openSettings() {
    const wrap = document.createElement('div');
    wrap.className = 'settings-list';
    [['about', '💎 О Бубах'], ['game', '🎮 Об игре'], ['privacy', '🔒 Приватность']].forEach(([key, label]) => {
      const b = document.createElement('button');
      b.className = 'set-btn' + (key === 'privacy' ? ' wide' : '');
      b.textContent = label;
      b.onclick = () => openInfo(key);
      wrap.appendChild(b);
    });
    openModal('⚙️ Настройки', wrap);
  }

  function openInfo(key) {
    const info = INFO[key];
    openModal(info.title, textBlock(info.text), openSettings);
  }

  // ---- Вкладка «Другое»: нажатия на пункты ----
  document.querySelectorAll('.menu-item').forEach(btn => {
    btn.addEventListener('click', () => {
      if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      const item = btn.dataset.item;
      if (item === 'промокод') openPromo();
      else if (item === 'настройки') openSettings();
      else if (item === 'профиль') openProfile();
      else if (item === 'криптовалюта') openCrypto();
    });
  });

  // ---- Профиль ----
  const PROFILE = { name: 'Ylola', status: 'Бизнесмен', city: 'Москва', level: 100, xp: 173, xpNext: 10000, repPlus: 0, repMinus: 0 };

  function openProfile() {
    const pct = Math.max(0, Math.min(100, PROFILE.xp / PROFILE.xpNext * 100));
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="prof-row"><span class="prof-ico">🏅</span><span>Профиль: <b>${PROFILE.name}</b></span></div>
      <div class="prof-row"><span class="prof-ico">💰</span><span>Статус: <b>${PROFILE.status}</b></span></div>
      <hr class="prof-sep">
      <div class="prof-row"><span class="prof-ico">🪙</span><span>Баланс: <b>${balance.toLocaleString('ru-RU')} Бубов</b></span></div>
      <div class="prof-row"><span class="prof-ico">🏙️</span><span>Город: <b>${PROFILE.city}</b></span></div>
      <div class="prof-row"><span class="prof-ico">📊</span><span>Уровень: <b>${PROFILE.level}</b> (${PROFILE.xp}/${PROFILE.xpNext} XP)</span></div>
      <div class="xp-bar"><div class="xp-fill" style="width:${pct}%"></div></div>
      <div class="prof-row"><span class="prof-ico">👍</span><span>Репутация: <b>+${PROFILE.repPlus} / -${PROFILE.repMinus}</b></span></div>
    `;
    openModal('👤 Профиль', wrap);
  }

  // ---- Криптовалюта Gram (TON): реальный курс с Binance ----
  // rate — сколько Бубов в одном долларе. Меняй по желанию.
  const CRYPTO = { pair: 'TONUSDT', name: 'Gram (TON)', rate: 100 };
  let cryptoInterval = '15m';
  let cryptoCandles = [];   // свечи в Бубах
  let cryptoLast = 0;       // текущая цена в Бубах
  let cryptoLive = false;   // есть ли связь с биржей

  function loadHoldings() {
    try { return JSON.parse(localStorage.getItem('gramHoldings')) || { qty: 0, avg: 0 }; }
    catch (e) { return { qty: 0, avg: 0 }; }
  }
  let holdings = loadHoldings();
  function saveHoldings() { localStorage.setItem('gramHoldings', JSON.stringify(holdings)); }

  let cryptoChartSvg = null, cryptoPriceEl = null, cryptoChangeEl = null;
  let cryptoStatsEl = null, cryptoQtyInput = null, cryptoMsgEl = null, cryptoNoteEl = null;

  const cryptoPrice = () => cryptoLast;

  // ---- Источники курса: если один недоступен, берём следующий ----
  let cryptoSource = '';
  let cryptoError = '';
  const TF_MAP = {
    '1m':  { binance: '1m',  bybit: '1',  okx: '1m',  gecko: 1 },
    '15m': { binance: '15m', bybit: '15', okx: '15m', gecko: 1 },
    '1h':  { binance: '1h',  bybit: '60', okx: '1H',  gecko: 7 },
    '1d':  { binance: '1d',  bybit: 'D',  okx: '1D',  gecko: 30 }
  };
  const toCandle = k => ({ o: +k[1], h: +k[2], l: +k[3], c: +k[4] });

  async function getJson(url) {
    const r = await fetch(url, { signal: AbortSignal.timeout ? AbortSignal.timeout(7000) : undefined });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  const SOURCES = [
    { name: 'Binance', get: async tf => {
        const kl = await getJson(`https://api.binance.com/api/v3/klines?symbol=TONUSDT&interval=${TF_MAP[tf].binance}&limit=60`);
        const tk = await getJson('https://api.binance.com/api/v3/ticker/price?symbol=TONUSDT');
        return { candles: kl.map(toCandle), price: +tk.price };
    }},
    { name: 'Bybit', get: async tf => {
        const kl = await getJson(`https://api.bybit.com/v5/market/kline?category=spot&symbol=TONUSDT&interval=${TF_MAP[tf].bybit}&limit=60`);
        const tk = await getJson('https://api.bybit.com/v5/market/tickers?category=spot&symbol=TONUSDT');
        return { candles: kl.result.list.slice().reverse().map(toCandle), price: +tk.result.list[0].lastPrice };
    }},
    { name: 'OKX', get: async tf => {
        const kl = await getJson(`https://www.okx.com/api/v5/market/candles?instId=TON-USDT&bar=${TF_MAP[tf].okx}&limit=60`);
        const tk = await getJson('https://www.okx.com/api/v5/market/ticker?instId=TON-USDT');
        return { candles: kl.data.slice().reverse().map(toCandle), price: +tk.data[0].last };
    }},
    { name: 'CoinGecko', get: async tf => {
        const ohlc = await getJson(`https://api.coingecko.com/api/v3/coins/the-open-network/ohlc?vs_currency=usd&days=${TF_MAP[tf].gecko}`);
        const p = await getJson('https://api.coingecko.com/api/v3/simple/price?ids=the-open-network&vs_currencies=usd');
        return { candles: ohlc.slice(-60).map(toCandle), price: p['the-open-network'].usd };
    }}
  ];

  async function fetchCrypto() {
    let lastErr = null;
    for (const src of SOURCES) {
      try {
        const d = await src.get(cryptoInterval);
        if (!d.candles.length || !(d.price > 0)) throw new Error('пустой ответ');
        const R = CRYPTO.rate;
        cryptoCandles = d.candles.map(k => ({ o: k.o * R, h: k.h * R, l: k.l * R, c: k.c * R }));
        cryptoLast = d.price * R;
        const last = cryptoCandles[cryptoCandles.length - 1];
        last.c = cryptoLast;
        last.h = Math.max(last.h, cryptoLast);
        last.l = Math.min(last.l, cryptoLast);
        cryptoSource = src.name;
        cryptoLive = true;
        cryptoError = '';
        return;
      } catch (e) {
        lastErr = e;
      }
    }
    throw lastErr || new Error('нет данных');
  }

  async function refreshCrypto() {
    try { await fetchCrypto(); }
    catch (e) {
      cryptoLive = false;
      cryptoError = 'Ни один источник не ответил. ' + (e && e.message ? e.message : '');
    }
    updateCryptoView();
  }

  function drawCandles(svg, candles) {
    const W = 320, H = 200, PAD = 10;
    const hi = Math.max(...candles.map(k => k.h));
    const lo = Math.min(...candles.map(k => k.l));
    const range = (hi - lo) || 1;
    const y = v => PAD + (hi - v) / range * (H - 2 * PAD);
    const slot = W / candles.length;
    const bw = slot * 0.6;

    let out = '';
    for (let i = 0; i <= 4; i++) {
      const yy = PAD + i * (H - 2 * PAD) / 4;
      out += `<line x1="0" x2="${W}" y1="${yy}" y2="${yy}" stroke="#2a2f3a" stroke-width="1"/>`;
    }
    candles.forEach((k, i) => {
      const x = i * slot + slot / 2;
      const col = k.c >= k.o ? '#30a46c' : '#e5484d';
      const top = y(Math.max(k.o, k.c));
      const bot = y(Math.min(k.o, k.c));
      out += `<line x1="${x}" x2="${x}" y1="${y(k.h)}" y2="${y(k.l)}" stroke="${col}" stroke-width="1.2"/>`;
      out += `<rect x="${x - bw / 2}" y="${top}" width="${bw}" height="${Math.max(1.5, bot - top)}" fill="${col}" rx="1"/>`;
    });
    svg.innerHTML = out;
  }

  function renderStats() {
    if (!cryptoStatsEl || !cryptoStatsEl.isConnected) return;
    const price = cryptoPrice();
    const value = holdings.qty * price;
    const pnl = value - holdings.qty * holdings.avg;
    const pnlCls = pnl >= 0 ? 'pl-up' : 'pl-down';
    const pnlTxt = holdings.qty ? (pnl >= 0 ? '+' : '') + Math.round(pnl).toLocaleString('ru-RU') : '0';
    const usd = cryptoLive ? '$' + (price / CRYPTO.rate).toFixed(3) : '—';
    cryptoStatsEl.innerHTML = `
      <div>Курс 1 Gram: <b>${usd}</b></div>
      <div>Баланс: <b>${balance.toLocaleString('ru-RU')} Бубов</b></div>
      <div>Монет Gram: <b>${holdings.qty}</b></div>
      <div>Средняя цена покупки: <b>${holdings.qty ? holdings.avg.toFixed(2) : '—'}</b></div>
      <div>Стоимость портфеля: <b>${Math.round(value).toLocaleString('ru-RU')} Бубов</b></div>
      <div>Прибыль: <b class="${holdings.qty ? pnlCls : ''}">${pnlTxt} Бубов</b></div>`;
  }

  function updateCryptoView() {
    if (!cryptoChartSvg || !cryptoChartSvg.isConnected) return;
    if (cryptoCandles.length) drawCandles(cryptoChartSvg, cryptoCandles);
    if (cryptoNoteEl) {
      cryptoNoteEl.textContent = cryptoLive
        ? `Источник: ${cryptoSource}. 1 USD = ${CRYPTO.rate} Бубов`
        : cryptoError + ' Проверь интернет и открой страницу по https.';
    }
    if (cryptoLive) {
      const first = cryptoCandles[0];
      const pct = (cryptoLast - first.o) / first.o * 100;
      cryptoPriceEl.textContent = cryptoLast.toFixed(2) + ' Бубов';
      cryptoChangeEl.textContent = (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
      cryptoChangeEl.className = 'crypto-change ' + (pct >= 0 ? 'up' : 'down');
    } else {
      cryptoPriceEl.textContent = 'Нет связи';
      cryptoChangeEl.textContent = 'курс недоступен';
      cryptoChangeEl.className = 'crypto-change down';
    }
    renderStats();
  }

  function cryptoMsg(text, ok) {
    cryptoMsgEl.textContent = text;
    cryptoMsgEl.className = 'promo-result ' + (ok ? 'ok' : 'err');
  }

  function buyGram() {
    if (!cryptoLive) return cryptoMsg('Нет связи с биржей, попробуй позже.', false);
    const qty = Math.floor(Number(cryptoQtyInput.value));
    if (!(qty >= 1)) return cryptoMsg('Введи количество монет.', false);
    const price = cryptoPrice();
    const cost = Math.round(qty * price);
    if (cost > balance) return cryptoMsg('Не хватает Бубов для покупки.', false);

    balance -= cost;
    const newQty = holdings.qty + qty;
    holdings = { qty: newQty, avg: (holdings.qty * holdings.avg + qty * price) / newQty };
    saveHoldings();
    renderBalance();
    cryptoMsg(`Куплено ${qty} Gram за ${cost} Бубов`, true);
    renderStats();
  }

  function sellGram() {
    if (!cryptoLive) return cryptoMsg('Нет связи с биржей, попробуй позже.', false);
    const qty = Math.floor(Number(cryptoQtyInput.value));
    if (!(qty >= 1)) return cryptoMsg('Введи количество монет.', false);
    if (qty > holdings.qty) return cryptoMsg('Столько монет у тебя нет.', false);

    const got = Math.round(qty * cryptoPrice());
    balance += got;
    holdings.qty -= qty;
    if (holdings.qty === 0) holdings.avg = 0;
    saveHoldings();
    renderBalance();
    cryptoMsg(`Продано ${qty} Gram за ${got} Бубов`, true);
    renderStats();
  }

  function openCrypto() {
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="crypto-head">
        <span class="crypto-price" id="cryptoPrice">—</span>
        <span class="crypto-change" id="cryptoChange"></span>
      </div>
      <div class="tf-row">
        <button class="tf-btn" data-tf="1m">1м</button>
        <button class="tf-btn" data-tf="15m">15м</button>
        <button class="tf-btn" data-tf="1h">1ч</button>
        <button class="tf-btn" data-tf="1d">1д</button>
      </div>
      <div class="chart-box">
        <svg id="cryptoChart" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="crypto-stats" id="cryptoStats"></div>
      <input type="number" min="1" step="1" class="promo-input" id="cryptoQty" placeholder="Количество Gram">
      <div class="trade-btns">
        <button class="buy-btn" id="buyBtn">Купить</button>
        <button class="sell-btn" id="sellBtn">Продать</button>
      </div>
      <div class="promo-result" id="cryptoMsg"></div>
      <div class="crypto-note" id="cryptoNote"></div>
    `;
    cryptoChartSvg = wrap.querySelector('#cryptoChart');
    cryptoPriceEl = wrap.querySelector('#cryptoPrice');
    cryptoChangeEl = wrap.querySelector('#cryptoChange');
    cryptoStatsEl = wrap.querySelector('#cryptoStats');
    cryptoQtyInput = wrap.querySelector('#cryptoQty');
    cryptoMsgEl = wrap.querySelector('#cryptoMsg');
    cryptoNoteEl = wrap.querySelector('#cryptoNote');
    wrap.querySelector('#buyBtn').onclick = buyGram;
    wrap.querySelector('#sellBtn').onclick = sellGram;

    const tfBtns = wrap.querySelectorAll('.tf-btn');
    tfBtns.forEach(b => {
      b.classList.toggle('active', b.dataset.tf === cryptoInterval);
      b.onclick = () => {
        cryptoInterval = b.dataset.tf;
        tfBtns.forEach(x => x.classList.toggle('active', x === b));
        cryptoCandles = [];
        updateCryptoView();
        refreshCrypto();
      };
    });

    openModal('💠 Gram (TON) — торговля', wrap);
    updateCryptoView();
  }

  // Обновление курса каждые 5 секунд (работает и когда окно закрыто)
  setInterval(refreshCrypto, 5000);
  refreshCrypto();

  // ---- Нажатие на игру ----
  document.querySelectorAll('.game-tile[data-game]').forEach(tile => {
    tile.addEventListener('click', () => {
      openGame(tile.dataset.game);
    });
  });
</script>
</body>
