<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Глобальное обновление 01.01.2027</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
        font-family: 'Segoe UI', 'Arial', sans-serif;
        overflow: hidden;
        background: #050510;
    }

    /* Основной фон (Глубокий космос) */
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        position: relative;
    }

    /* Контейнер для звезд на фоне */
    #space {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        background: radial-gradient(circle at 50% 50%, #1a1a3e 0%, #0a0a1f 60%, #000 100%);
    }

    .star {
        position: absolute;
        background-color: #fff;
        border-radius: 50%;
        animation: twinkle infinite alternate;
    }

    @keyframes twinkle {
        0% { opacity: 0.1; transform: scale(0.8); }
        100% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 8px #fff; }
    }

    /* Снежинки */
    .snowflake {
        position: absolute;
        top: -10px;
        color: #fff;
        opacity: 0.8;
        pointer-events: none;
        animation: fall linear infinite;
        text-shadow: 0 0 8px rgba(180, 220, 255, 0.9);
        z-index: 1;
    }

    @keyframes fall {
        0% { transform: translateY(-10vh) translateX(0) rotate(0deg); }
        100% { transform: translateY(110vh) translateX(40px) rotate(360deg); }
    }

    /* Конфетти */
    .confetti {
        position: absolute;
        top: -20px;
        pointer-events: none;
        animation: confettiFall linear infinite;
        border-radius: 2px;
        z-index: 1;
    }

    @keyframes confettiFall {
        0% { transform: translateY(-5vh) rotate(0deg); opacity: 1; }
        100% { transform: translateY(105vh) rotate(720deg); opacity: 0.2; }
    }

    /* Основной контейнер контента с защитной подложкой */
    .container {
        z-index: 10;
        text-align: center;
        padding: 40px 20px;
        max-width: 1100px;
        width: 95%;
        /* Полупрозрачная подложка, чтобы текст не сливался с фоном */
        background: rgba(10, 10, 25, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 30px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        animation: fadeIn 1.2s ease-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h1 {
        font-size: clamp(1.8rem, 4vw, 3rem);
        font-weight: 800;
        margin-bottom: 15px;
        background: linear-gradient(90deg, #ffd700, #ff6b6b, #4ecdc4, #ffd700);
        background-size: 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: gradientMove 4s linear infinite;
        letter-spacing: 1px;
        filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.3));
    }

    @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        100% { background-position: 300% 50%; }
    }

    .subtitle {
        font-size: clamp(0.9rem, 2vw, 1.2rem);
        color: #c9d6ff;
        margin-bottom: 40px;
        line-height: 1.6;
    }

    .subtitle .date {
        color: #ffd700;
        font-weight: 700;
        text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
    }

    /* Таймер */
    .timer {
        display: flex;
        justify-content: center;
        gap: clamp(10px, 2vw, 25px);
        flex-wrap: wrap;
        margin-bottom: 45px;
    }

    .time-block {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 18px;
        padding: clamp(15px, 2vw, 25px) clamp(10px, 2vw, 30px);
        min-width: clamp(75px, 12vw, 130px);
        backdrop-filter: blur(10px);
        box-shadow: 0 0 20px rgba(100, 150, 255, 0.1), inset 0 0 15px rgba(255, 255, 255, 0.02);
        transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
        position: relative;
        overflow: hidden;
    }

    .time-block:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(255, 215, 0, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.05);
        border-color: rgba(255, 215, 0, 0.5);
    }

    .time-value {
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        background: linear-gradient(180deg, #ffffff, #a8c4ff);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        display: block;
        line-height: 1;
        text-shadow: 0 0 20px rgba(120, 180, 255, 0.3);
    }

    .time-label {
        font-size: clamp(0.65rem, 1.2vw, 0.85rem);
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #8fa8d8;
        margin-top: 10px;
        display: block;
        font-weight: 600;
    }

    /* Карточки подарков */
    .gifts {
        display: flex;
        justify-content: center;
        gap: clamp(10px, 2vw, 20px);
        flex-wrap: wrap;
    }

    .gift-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 215, 0, 0.2);
        border-radius: 16px;
        padding: 15px 25px;
        font-size: clamp(0.8rem, 1.5vw, 1rem);
        color: #e6e9ff;
        backdrop-filter: blur(8px);
        transition: all 0.3s;
        animation: float 4s ease-in-out infinite;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .gift-card:nth-child(2) { animation-delay: 0.5s; }
    .gift-card:nth-child(3) { animation-delay: 1s; }

    .gift-card:hover {
        border-color: #ffd700;
        box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
        background: rgba(255, 215, 0, 0.05);
        transform: scale(1.05);
    }

    .gift-card .emoji {
        font-size: 1.8em;
        margin-bottom: 8px;
    }

    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
    }

    /* Финальная надпись */
    .warning {
        margin-top: 40px;
        font-size: clamp(0.9rem, 2vw, 1.1rem);
        color: #ff6b6b;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
        animation: pulse 1.5s ease-in-out infinite;
        text-shadow: 0 0 15px rgba(255, 107, 107, 0.8);
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.02); }
    }

    /* Адаптив для маленьких экранов */
    @media (max-width: 480px) {
        .container { padding: 25px 15px; width: 100%; border-radius: 20px; }
        .time-block { min-width: 65px; padding: 10px 8px; }
        .timer { gap: 6px; }
        .gift-card { padding: 12px 15px; }
    }
</style>
</head>
<body>

<!-- Фон для звезд -->
<div id="space"></div>

<div class="container">
    <h1>🎉 ГЛОБАЛЬНОЕ ОБНОВЛЕНИЕ 🎉</h1>
    <p class="subtitle">
        Уже совсем скоро — <span class="date">1 января 2027 года в 10:00 по МСК</span><br>
        Массовая новогодняя раздача подарков, бонусов и сюрпризов! Не пропустите!
    </p>

    <div class="timer" id="timer">
        <div class="time-block">
            <span class="time-value" id="days">00</span>
            <span class="time-label">Дней</span>
        </div>
        <div class="time-block">
            <span class="time-value" id="hours">00</span>
            <span class="time-label">Часов</span>
        </div>
        <div class="time-block">
            <span class="time-value" id="minutes">00</span>
            <span class="time-label">Минут</span>
        </div>
        <div class="time-block">
            <span class="time-value" id="seconds">00</span>
            <span class="time-label">Секунд</span>
        </div>
    </div>

    <div class="gifts">
        <div class="gift-card">
            <span class="emoji">🎁</span>
            Массовые подарки
        </div>
        <div class="gift-card">
            <span class="emoji">💰</span>
            Бонусы и промокоды
        </div>
        <div class="gift-card">
            <span class="emoji">🎆</span>
            Новогодние сюрпризы
        </div>
    </div>

    <div class="warning" id="warning">⚠️ Не пропустите главное событие года! ⚠️</div>
</div>

<script>
    // ================= ТАЙМЕР =================
    // 01.01.2027 10:00 МСК (UTC+3) = 01.01.2027 07:00 UTC
    const targetDate = new Date(Date.UTC(2027, 0, 1, 7, 0, 0)).getTime();

    function pad(num) {
        return num < 10 ? '0' + num : num.toString();
    }

    function updateTimer() {
        const now = Date.now();
        let diff = targetDate - now;

        if (diff <= 0) {
            document.getElementById('days').textContent = '00';
            document.getElementById('hours').textContent = '00';
            document.getElementById('minutes').textContent = '00';
            document.getElementById('seconds').textContent = '00';
            document.getElementById('warning').textContent = '🎉 ОБНОВЛЕНИЕ ВЫШЛО! 🎉';
            document.getElementById('warning').style.color = '#4ecdc4';
            document.querySelector('h1').textContent = '🚀 ОБНОВЛЕНИЕ УЖЕ ДОСТУПНО! 🚀';
            return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        diff -= days * (1000 * 60 * 60 * 24);

        const hours = Math.floor(diff / (1000 * 60 * 60));
        diff -= hours * (1000 * 60 * 60);

        const minutes = Math.floor(diff / (1000 * 60));
        diff -= minutes * (1000 * 60);

        const seconds = Math.floor(diff / 1000);

        document.getElementById('days').textContent = pad(days);
        document.getElementById('hours').textContent = pad(hours);
        document.getElementById('minutes').textContent = pad(minutes);
        document.getElementById('seconds').textContent = pad(seconds);
    }

    updateTimer();
    setInterval(updateTimer, 1000);

    // ================= ЭФФЕКТЫ =================
    
    // 1. Генерация правильных звезд через JS
    function createStars() {
        const space = document.getElementById('space');
        const starCount = 150; // Количество звезд
        
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            
            // Случайный размер от 1 до 3 пикселей
            const size = Math.random() * 2 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            
            // Случайное положение
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            
            // Случайная задержка и скорость мерцания
            star.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
            star.style.animationDelay = Math.random() * 2 + 's';
            
            space.appendChild(star);
        }
    }

    // 2. Снежинки
    function createSnowflakes() {
        const count = 40;
        const symbols = ['❄', '❅', '❆', '✻', '✼'];
        
        for (let i = 0; i < count; i++) {
            const flake = document.createElement('div');
            flake.className = 'snowflake';
            flake.textContent = symbols[Math.floor(Math.random() * symbols.length)];
            flake.style.left = Math.random() * 100 + 'vw';
            flake.style.fontSize = (Math.random() * 1 + 0.5) + 'em';
            flake.style.animationDuration = (Math.random() * 8 + 6) + 's';
            flake.style.animationDelay = Math.random() * 8 + 's';
            flake.style.opacity = Math.random() * 0.6 + 0.3;
            document.body.appendChild(flake);
        }
    }

    // 3. Конфетти
    function createConfetti() {
        const colors = ['#ffd700', '#ff6b6b', '#4ecdc4', '#a29bfe', '#fd79a8', '#55efc4'];
        const count = 30;
        
        for (let i = 0; i < count; i++) {
            const c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            c.style.width = (Math.random() * 5 + 4) + 'px';
            c.style.height = (Math.random() * 8 + 6) + 'px';
            c.style.animationDuration = (Math.random() * 6 + 5) + 's';
            c.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(c);
        }
    }

    // Запуск эффектов
    createStars();
    createSnowflakes();
    createConfetti();

    // 4. Искры при движении мыши
    document.addEventListener('mousemove', function(e) {
        if (Math.random() > 0.92) {
            const spark = document.createElement('div');
            spark.style.position = 'fixed';
            spark.style.left = e.clientX + 'px';
            spark.style.top = e.clientY + 'px';
            spark.style.width = '4px';
            spark.style.height = '4px';
            spark.style.borderRadius = '50%';
            spark.style.background = '#ffd700';
            spark.style.boxShadow = '0 0 10px #ffd700';
            spark.style.pointerEvents = 'none';
            spark.style.zIndex = '9999';
            spark.style.transition = 'all 0.6s ease-out';
            document.body.appendChild(spark);
            
            // Анимация угасания
            requestAnimationFrame(() => {
                spark.style.transform = `translate(${(Math.random()-0.5)*80}px, ${(Math.random()-0.5)*80}px) scale(0)`;
                spark.style.opacity = '0';
            });
            setTimeout(() => spark.remove(), 700);
        }
    });
</script>
</body>
</html>
