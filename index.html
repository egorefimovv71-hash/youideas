<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скоро будет игра — Ждите!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #fff;
            overflow: hidden;
            text-align: center;
        }

        .container {
            padding: 40px 20px;
            animation: fadeIn 1.5s ease;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 4rem);
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #00f5ff, #ff00c8, #00f5ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
            margin-bottom: 20px;
        }

        p {
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            opacity: 0.85;
            margin-bottom: 40px;
        }

        /* Анимированные точки */
        .dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Пульсирующий прогресс-бар */
        .loader {
            width: min(400px, 80vw);
            height: 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            margin: 0 auto;
            overflow: hidden;
            position: relative;
        }

        .loader::before {
            content: '';
            position: absolute;
            inset: 0;
            width: 40%;
            border-radius: 10px;
            background: linear-gradient(90deg, #00f5ff, #ff00c8);
            animation: load 2.5s ease-in-out infinite;
        }

        @keyframes load {
            0%   { left: -40%; }
            50%  { left: 60%; }
            100% { left: 100%; }
        }

        /* Плавающие частицы на фоне */
        .particle {
            position: fixed;
            border-radius: 50%;
            background: rgba(0, 245, 255, 0.5);
            pointer-events: none;
            animation: float linear infinite;
        }

        @keyframes float {
            from { transform: translateY(100vh); opacity: 0; }
            10%  { opacity: 1; }
            to   { transform: translateY(-10vh); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Скоро будет игра</h1>
        <p>Ждите<span class="dots"></span></p>
        <div class="loader"></div>
    </div>

    <script>
        // Создаём плавающие частицы
        const body = document.body;
        for (let i = 0; i < 25; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 8 + 3;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = (Math.random() * 8 + 6) + 's';
            p.style.animationDelay = (Math.random() * 10) + 's';
            body.appendChild(p);
        }
    </script>
</body>
</html>
