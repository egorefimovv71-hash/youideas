<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ты очень красивая</title>
    <style>
        /* Сброс отступов и настройка шрифтов */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Красивый переливающийся градиентный фон */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
            background-size: 200% 200%;
            animation: gradientAnimation 10s ease infinite;
            
            /* Центрирование текста */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Анимация для фона */
        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            /* Стеклянный эффект (Glassmorphism) */
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            
            padding: 60px 80px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            
            /* Плавное появление */
            animation: fadeIn 2s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        h1 {
            font-size: 4rem;
            color: #2c3e50;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
            
            /* Пульсирующий эффект для текста */
            animation: pulse 2s infinite alternate;
        }

        /* Анимация появления */
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Анимация пульсации */
        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
        
        /* Адаптивность для телефонов */
        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .card { padding: 40px 20px; width: 90%; }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Ты очень красивая ✨</h1>
    </div>

</body>
</html>
